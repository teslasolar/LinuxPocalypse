<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ClaudeOS - Modular</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css">
<link rel="stylesheet" href="ui.css">
</head>
<body>
<div id="term" class="terminal-fullscreen"></div>

<!-- Load xterm.js -->
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>

<!-- Load components -->
<script src="filesystem.js"></script>
<script src="shell.js"></script>
<script src="terminal.js"></script>
<script src="api.js"></script>
<script src="boot.js"></script>

<script>
window.addEventListener('load', () => {
  // Check dependencies
  if (typeof Terminal === 'undefined') {
    document.getElementById('term').innerHTML =
      '<pre style="color:#f55;padding:20px">Error: xterm.js failed to load</pre>';
    return;
  }

  // Initialize components
  const fs = Object.create(FS).init();
  const shell = Object.create(Shell);
  shell.fs = fs;

  const termUI = Object.create(TerminalUI);
  termUI.init(document.getElementById('term'), shell);

  const api = Object.create(ClaudeAPI);
  api.init({ baseUrl: '/api' });

  // Boot sequence
  const boot = Object.create(Boot);
  boot.init({
    terminal: termUI,
    shell: shell,
    fs: fs,
    api: api,
    onComplete: () => termUI.prompt()
  });

  // Check for quick boot flag
  const quick = new URLSearchParams(location.search).has('quick');
  if (quick) {
    boot.quick();
  } else {
    boot.run();
  }

  termUI.focus();
});
</script>
</body>
</html>
