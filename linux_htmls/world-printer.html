<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>World Printer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#1a1a2a;overflow:hidden;font:9px monospace;color:#8af}
#c{position:fixed;inset:0}.p{position:absolute;background:rgba(20,20,35,.95);border:1px solid;border-radius:6px;padding:10px;z-index:10;backdrop-filter:blur(5px)}
.t{background:#0a0a15;color:#4af;padding:6px;height:55px;overflow-y:auto;font-size:8px;border:1px solid #4af2;border-radius:3px}
button{background:linear-gradient(135deg,#48f,#24a);color:#fff;border:0;padding:5px 8px;margin:2px;font-size:8px;border-radius:3px;cursor:pointer;font-weight:bold}
button:hover{filter:brightness(1.3)}
.r{background:linear-gradient(135deg,#f44,#a22)}.g{background:linear-gradient(135deg,#4a4,#282)}.y{background:linear-gradient(135deg,#fa4,#a62)}
.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(50px,1fr));gap:3px;margin:5px 0}
.s{padding:4px;text-align:center;border:1px solid;border-radius:2px;background:#0002;font-size:8px}
.bar{height:5px;background:#111;border-radius:2px;margin:3px 0}.fill{height:100%;border-radius:2px;transition:width .2s}
input[type=range]{width:100%;height:4px;-webkit-appearance:none;background:#224;border-radius:2px;margin:4px 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;background:#48f;border-radius:50%;cursor:pointer}
</style></head><body><canvas id="c"></canvas>

<div class="p" style="top:8px;left:8px;border-color:#48f;width:230px">
<div style="color:#48f;text-align:center;font-size:11px">🌍 WORLD PRINTER</div>
<div id="stats"></div>
<div id="progress"></div>
</div>

<div class="p" style="top:8px;right:8px;border-color:#fa0;width:260px">
<div style="color:#fa0;font-size:10px">🖨️ PRINT CONTROL</div>
<div class="gr">
<button class="g" onclick="W.startPrint('hills')">🏔️Hills</button>
<button class="g" onclick="W.startPrint('city')">🏙️City</button>
<button class="g" onclick="W.startPrint('island')">🏝️Island</button>
<button class="g" onclick="W.startPrint('maze')">🌀Maze</button>
<button class="g" onclick="W.startPrint('pyramid')">🔺Pyra</button>
<button class="g" onclick="W.startPrint('waves')">🌊Wave</button>
</div>
<div style="margin-top:6px;font-size:8px">
<div>Speed: <span id="speedVal">1.0</span>x</div>
<input type="range" id="speed" min="1" max="50" value="10" oninput="W.speed=this.value/10;document.getElementById('speedVal').textContent=W.speed.toFixed(1)">
<div>Heads: <span id="headsVal">4</span></div>
<input type="range" id="heads" min="1" max="8" value="4" oninput="W.numHeads=+this.value;document.getElementById('headsVal').textContent=this.value">
</div>
<div class="gr">
<button onclick="W.pause=!W.pause">⏯️</button>
<button class="y" onclick="W.speed=5">⚡Fast</button>
<button class="r" onclick="W.clear()">🗑️Clear</button>
</div>
<div id="log" class="t"></div>
</div>

<div class="p" style="bottom:8px;left:8px;border-color:#0f8;width:230px">
<div style="color:#0f8;font-size:10px">📊 EXTRUSION</div>
<div id="extrusion"></div>
</div>

<div class="p" style="bottom:8px;right:8px;border-color:#f0f;width:230px">
<div style="color:#f0f;font-size:10px">🔧 PRINT HEADS</div>
<div id="heads"></div>
</div>

<script>
const T={
  τ:Math.PI*2,π:Math.PI,
  rng:(a=0,b=1)=>a+(b-a)*Math.random(),
  rngInt:(a,b)=>Math.floor(T.rng(a,b+1)),
  v3:(x=0,y=0,z=0)=>new THREE.Vector3(x,y,z),
  $:id=>document.getElementById(id),
  html:(id,h)=>T.$(id).innerHTML=h,
  log:(id,m)=>{const e=T.$(id);e.textContent+=m+'\n';e.scrollTop=e.scrollHeight}
};

// Terrain filaments: [name, color, emissive]
const FILAMENTS={
  grass:[0x44aa44,0x228822],
  dirt:[0x885533,0x442211],
  stone:[0x666666,0x333333],
  water:[0x2266cc,0x1144aa],
  sand:[0xddcc77,0xaa9944],
  snow:[0xeeeeff,0xccccdd],
  lava:[0xff4400,0xff2200],
  wood:[0x885522,0x553311],
  leaf:[0x22aa22,0x116611],
  metal:[0x8888aa,0x444466]
};

const W={
  beads:[],
  printHeads:[],
  toolpath:[],
  pathIndex:0,
  currentLayer:0,
  totalLayers:0,
  isPrinting:false,
  pause:false,
  speed:1,
  numHeads:4,
  worldSize:32,
  layerHeight:.3,
  beadWidth:.4,
  beadsPlaced:0,
  heightmap:null,
  terrainType:null,

  R:{
    scene:null,camera:null,renderer:null,

    init(){
      this.scene=new THREE.Scene();
      this.camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,500);
      this.renderer=new THREE.WebGLRenderer({canvas:T.$('c'),antialias:true});
      this.renderer.setSize(innerWidth,innerHeight);
      this.renderer.setClearColor(0x1a1a2a);
      this.camera.position.set(40,35,40);
      this.camera.lookAt(16,5,16);

      // Lighting
      this.scene.add(new THREE.AmbientLight(0x404060,.5));
      const sun=new THREE.DirectionalLight(0xffffee,.8);
      sun.position.set(40,60,40);
      this.scene.add(sun);

      // Build plate
      const plate=new THREE.Mesh(
        new THREE.BoxGeometry(40,.2,40),
        new THREE.MeshPhongMaterial({color:0x222233})
      );
      plate.position.set(16,-.1,16);
      this.scene.add(plate);

      // Grid on plate
      const grid=new THREE.GridHelper(40,32,0x334,0x223);
      grid.position.set(16,0,16);
      this.scene.add(grid);

      // Print frame
      this.createFrame();

      this.scene.fog=new THREE.FogExp2(0x1a1a2a,.008);
      this.animate();
    },

    createFrame(){
      const mat=new THREE.MeshPhongMaterial({color:0x445566});
      const pillarGeo=new THREE.BoxGeometry(.5,30,.5);

      [[0,0],[32,0],[32,32],[0,32]].forEach(([x,z])=>{
        const p=new THREE.Mesh(pillarGeo,mat);
        p.position.set(x,15,z);
        this.scene.add(p);
      });

      // Top rails
      const railX=new THREE.Mesh(new THREE.BoxGeometry(32,.4,.4),mat);
      const railZ=new THREE.Mesh(new THREE.BoxGeometry(.4,.4,32),mat);
      [0,32].forEach(z=>{
        const r=railX.clone();
        r.position.set(16,30,z);
        this.scene.add(r);
      });
      [0,32].forEach(x=>{
        const r=railZ.clone();
        r.position.set(x,30,16);
        this.scene.add(r);
      });
    },

    createPrintHead(id){
      const group=new THREE.Group();

      // Carriage
      const carriage=new THREE.Mesh(
        new THREE.BoxGeometry(2,1,2),
        new THREE.MeshPhongMaterial({color:0x556677})
      );
      group.add(carriage);

      // Hotend
      const hotend=new THREE.Mesh(
        new THREE.CylinderGeometry(.3,.15,1.5,8),
        new THREE.MeshPhongMaterial({color:0xffaa00,emissive:0xff6600,emissiveIntensity:.4})
      );
      hotend.position.y=-1;
      group.add(hotend);

      // Nozzle glow
      const glow=new THREE.PointLight(0xff6600,.5,4);
      glow.position.y=-1.5;
      group.add(glow);

      // Extrusion indicator
      const indicator=new THREE.Mesh(
        new THREE.SphereGeometry(.15,8,8),
        new THREE.MeshBasicMaterial({color:0x44ff44,transparent:true,opacity:0})
      );
      indicator.position.y=-1.8;
      group.add(indicator);
      group.indicator=indicator;

      group.position.set(16,28,16);
      this.scene.add(group);
      return group;
    },

    createBead(x1,z1,x2,z2,y,filament){
      const dx=x2-x1,dz=z2-z1;
      const len=Math.sqrt(dx*dx+dz*dz);
      if(len<.01)return null;

      const[color,emissive]=FILAMENTS[filament]||FILAMENTS.stone;
      const h=W.layerHeight;
      const w=W.beadWidth;

      const geo=new THREE.CylinderGeometry(w/2,w/2,len,6,1);
      const mat=new THREE.MeshPhongMaterial({
        color,emissive,emissiveIntensity:.15,shininess:40
      });

      const mesh=new THREE.Mesh(geo,mat);
      mesh.scale.set(h/w*1.5,1,1);
      mesh.rotation.order='YXZ';
      mesh.rotation.x=T.π/2;
      mesh.rotation.y=Math.atan2(dx,dz);
      mesh.position.set((x1+x2)/2,y+h/2,(z1+z2)/2);

      this.scene.add(mesh);
      W.beads.push(mesh);
      return mesh;
    },

    clearBeads(){
      W.beads.forEach(b=>this.scene.remove(b));
      W.beads=[];
    },

    animate(){
      requestAnimationFrame(()=>this.animate());
      const t=Date.now()*.001;

      // Camera orbit
      const r=50;
      this.camera.position.x=16+Math.cos(t*.1)*r;
      this.camera.position.z=16+Math.sin(t*.1)*r;
      this.camera.position.y=30+Math.sin(t*.08)*10;
      this.camera.lookAt(16,W.currentLayer*W.layerHeight,16);

      this.renderer.render(this.scene,this.camera);
    }
  },

  generateHeightmap(type){
    const size=this.worldSize;
    const map=[];

    for(let x=0;x<size;x++){
      map[x]=[];
      for(let z=0;z<size;z++){
        let h=0;
        const nx=x/size,nz=z/size;
        const cx=nx-.5,cz=nz-.5;
        const dist=Math.sqrt(cx*cx+cz*cz);

        switch(type){
          case'hills':
            h=4+Math.sin(x*.4)*3+Math.cos(z*.3)*3+Math.sin(x*.2+z*.2)*2;
            break;
          case'city':
            // Random buildings
            if(x%6<4&&z%6<4&&Math.random()<.6){
              h=2+Math.random()*12;
            }else{
              h=1;
            }
            break;
          case'island':
            h=Math.max(0,8*(1-dist*2.5)+Math.sin(x*.5)*2+Math.cos(z*.5)*2);
            break;
          case'maze':
            h=(x%4<2)!==(z%4<2)?4:1;
            if(Math.random()<.1)h=6;
            break;
          case'pyramid':
            const edge=Math.max(Math.abs(cx),Math.abs(cz));
            h=Math.max(0,(0.5-edge)*30);
            break;
          case'waves':
            h=4+Math.sin(x*.3)*3+Math.sin(z*.3+x*.1)*3+Math.sin((x+z)*.2)*2;
            break;
        }

        map[x][z]=Math.max(1,Math.floor(h));
      }
    }

    return map;
  },

  getFilamentForLayer(y,maxH,type){
    const ratio=y/maxH;

    if(type==='city'){
      return y<2?'stone':['metal','stone','metal'][y%3];
    }
    if(type==='pyramid'){
      return ratio>.9?'sand':'stone';
    }
    if(type==='island'){
      if(y<2)return'sand';
      if(ratio>.8)return'snow';
      if(ratio>.5)return'stone';
      return ratio>.3?'dirt':'grass';
    }

    // Default terrain
    if(ratio>.85)return'snow';
    if(ratio>.6)return'stone';
    if(ratio>.3)return'dirt';
    return'grass';
  },

  generateToolpath(){
    const paths=[];
    const size=this.worldSize;
    const map=this.heightmap;

    // Find max height
    let maxH=0;
    for(let x=0;x<size;x++){
      for(let z=0;z<size;z++){
        maxH=Math.max(maxH,map[x][z]);
      }
    }
    this.totalLayers=maxH;

    // Generate paths layer by layer
    for(let y=1;y<=maxH;y++){
      // Zigzag pattern per layer
      const dir=y%2===0;

      for(let z=0;z<size;z++){
        const row=[];
        for(let x=0;x<size;x++){
          const rx=dir?x:size-1-x;
          if(map[rx][z]>=y){
            row.push({x:rx,z,y,filament:this.getFilamentForLayer(y,map[rx][z],this.terrainType)});
          }
        }

        // Create paths from row
        if(row.length>0){
          let start=row[0];
          for(let i=1;i<row.length;i++){
            const curr=row[i];
            // Check if continuous
            if(Math.abs(curr.x-row[i-1].x)<=1){
              // Continue
            }else{
              // Break - save path
              paths.push({
                x1:start.x,z1:start.z,
                x2:row[i-1].x,z2:row[i-1].z,
                y:start.y,
                filament:start.filament
              });
              start=curr;
            }
          }
          // Final segment
          paths.push({
            x1:start.x,z1:start.z,
            x2:row[row.length-1].x,z2:row[row.length-1].z,
            y:start.y,
            filament:start.filament
          });
        }
      }
    }

    return paths;
  },

  startPrint(type){
    if(this.isPrinting)return;

    this.clear();
    this.terrainType=type;
    T.log('log',`🌍 Generating ${type}...`);

    this.heightmap=this.generateHeightmap(type);
    this.toolpath=this.generateToolpath();

    T.log('log',`📐 ${this.toolpath.length} paths, ${this.totalLayers} layers`);

    // Create print heads
    this.printHeads=[];
    for(let i=0;i<this.numHeads;i++){
      const mesh=this.R.createPrintHead(i);
      this.printHeads.push({
        id:i,
        mesh,
        busy:false,
        pathIdx:0,
        beadsPlaced:0
      });
    }

    this.pathIndex=0;
    this.currentLayer=1;
    this.isPrinting=true;
    this.beadsPlaced=0;

    T.log('log','🖨️ Printing started!');
    this.printLoop();
    this.updateUI();
  },

  printLoop(){
    if(!this.isPrinting||this.pause){
      if(this.isPrinting)setTimeout(()=>this.printLoop(),100);
      return;
    }

    // Process multiple paths per frame based on speed
    const pathsPerFrame=Math.ceil(this.speed*this.numHeads);

    for(let i=0;i<pathsPerFrame&&this.pathIndex<this.toolpath.length;i++){
      const path=this.toolpath[this.pathIndex];
      const head=this.printHeads[this.pathIndex%this.printHeads.length];

      // Move head
      if(head.mesh){
        head.mesh.position.x=path.x2;
        head.mesh.position.z=path.z2;
        head.mesh.position.y=path.y*this.layerHeight+2;

        // Flash indicator
        head.mesh.indicator.material.opacity=.8;
        setTimeout(()=>{
          if(head.mesh.indicator)head.mesh.indicator.material.opacity=0;
        },30);
      }

      // Create bead
      this.R.createBead(path.x1,path.z1,path.x2,path.z2,path.y*this.layerHeight,path.filament);

      this.beadsPlaced++;
      head.beadsPlaced++;
      this.currentLayer=path.y;
      this.pathIndex++;
    }

    this.updateUI();

    if(this.pathIndex>=this.toolpath.length){
      this.finishPrint();
    }else{
      requestAnimationFrame(()=>this.printLoop());
    }
  },

  finishPrint(){
    this.isPrinting=false;
    this.printHeads.forEach(h=>{
      if(h.mesh)h.mesh.position.y=28;
    });
    T.log('log',`✅ Complete! ${this.beadsPlaced} beads`);
    this.updateUI();
  },

  clear(){
    this.isPrinting=false;
    this.R.clearBeads();
    this.printHeads.forEach(h=>{
      if(h.mesh)this.R.scene.remove(h.mesh);
    });
    this.printHeads=[];
    this.toolpath=[];
    this.pathIndex=0;
    this.currentLayer=0;
    this.beadsPlaced=0;
    T.log('log','🗑️ Cleared');
    this.updateUI();
  },

  updateUI(){
    const progress=this.toolpath.length?Math.round(this.pathIndex/this.toolpath.length*100):0;

    T.html('stats',`
      <div class="gr">
        <div class="s" style="border-color:#48f">L${this.currentLayer}/${this.totalLayers}</div>
        <div class="s" style="border-color:#4f4">${this.beadsPlaced}</div>
        <div class="s" style="border-color:#f80">${this.isPrinting?'▶':'⏸'}</div>
      </div>
    `);

    T.html('progress',`
      <div style="font-size:8px">${progress}% - ${this.terrainType||'Ready'}</div>
      <div class="bar"><div class="fill" style="width:${progress}%;background:linear-gradient(90deg,#48f,#4f8)"></div></div>
    `);

    T.html('extrusion',`
      <div style="font-size:8px">Bead Width: ${this.beadWidth}mm</div>
      <div style="font-size:8px">Layer Height: ${this.layerHeight}mm</div>
      <div style="font-size:8px">Paths: ${this.pathIndex}/${this.toolpath.length}</div>
      <div style="font-size:8px">Speed: ${this.speed.toFixed(1)}x</div>
    `);

    T.html('heads',this.printHeads.map(h=>
      `<div style="font-size:8px;color:#${h.beadsPlaced>0?'4f4':'888'}">Head${h.id}: ${h.beadsPlaced} beads</div>`
    ).join('')||'<div style="color:#555">No heads</div>');
  },

  init(){
    this.R.init();
    T.log('log','🌍 World Printer v1');
    T.log('log','Select terrain to print!');
    this.updateUI();
  }
};

onload=()=>setTimeout(()=>W.init(),100);
onresize=()=>{W.R.renderer.setSize(innerWidth,innerHeight);W.R.camera.aspect=innerWidth/innerHeight;W.R.camera.updateProjectionMatrix()};
</script></body></html>
