<script>

  dodeca:s=>new THREE.DodecahedronGeometry(s*2),

  tetra:s=>new THREE.TetrahedronGeometry(s*2.5),

  cone:s=>new THREE.ConeGeometry(s*1.5,s*3,6)

const S={
  files:[],dirs:[],deps:[],commits:[],particles:[],
  showFlow:true,showForce:true,showLabels:false,
  selected:null,
  raycaster:new THREE.Raycaster(),
  mouse:new THREE.Vector2(),

  init(){
    this.sc=new THREE.Scene();
    this.ca=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,1000);
    this.rn=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
    this.rn.setSize(innerWidth,innerHeight);
    this.rn.setClearColor(0x000308);
    this.ca.position.set(80,60,80);

    // Lighting
    this.sc.add(new THREE.AmbientLight(0x303040,.5));
    const dl=new THREE.DirectionalLight(0xffffff,.6);dl.position.set(50,100,50);
    this.sc.add(dl);
    [0x0088ff,0x00ff88,0xff8800,0xff0088].forEach((c,i)=>{
      const pl=new THREE.PointLight(c,.3,120);
      pl.position.set(Math.cos(i*1.57)*60,30,Math.sin(i*1.57)*60);
      this.sc.add(pl);
    });

    // Star field
    const stars=new THREE.BufferGeometry();
    const starPos=[];
    for(let i=0;i<2000;i++){
      starPos.push(T.rnd(-500,500),T.rnd(-500,500),T.rnd(-500,500));
    }
    stars.setAttribute('position',new THREE.Float32BufferAttribute(starPos,3));
    this.sc.add(new THREE.Points(stars,new THREE.PointsMaterial({color:0xffffff,size:.5})));

    // Grid
    const grid=new THREE.GridHelper(200,40,0x0a2040,0x051020);
    grid.position.y=-30;
    this.sc.add(grid);

    this.sc.fog=new THREE.FogExp2(0x000308,.003);

    // Deps/flow group
    this.depsGroup=new THREE.Group();
    this.sc.add(this.depsGroup);
    this.particleGroup=new THREE.Group();
    this.sc.add(this.particleGroup);

    window.addEventListener('mousemove',e=>this.onMouse(e));
    window.addEventListener('click',e=>this.onClick(e));

    this.generate();
    this.animate();
    setInterval(()=>this.physics(),16);
  },

  createFileMesh(f){
    const ft=FILE_TYPES[f.t]||{color:0x888888,geo:'sphere',size:1};
    const geo=GEOS[ft.geo](ft.size);
    const mat=new THREE.MeshPhongMaterial({
      color:ft.color,
      emissive:ft.color,
      emissiveIntensity:.15,
      transparent:true,
      opacity:.9
    });
    const mesh=new THREE.Mesh(geo,mat);

    // Glow ring
    const ring=new THREE.Mesh(
      new THREE.TorusGeometry(ft.size*2.5,.15,8,32),
      new THREE.MeshBasicMaterial({color:ft.color,transparent:true,opacity:.3})
    );
    ring.rotation.x=Math.PI/2;
    mesh.add(ring);

    return mesh;
  },

  generate(){
    this.clear();
    const type=document.getElementById('repo-type').value;
    const repo=REPOS[type];

    // Create dirs
    repo.dirs.forEach((d,i)=>{
      const depth=d.split('/').length;
      const angle=(i/repo.dirs.length)*Math.PI*2;
      const radius=25+depth*12;
      this.dirs.push({
        name:d,
        x:Math.cos(angle)*radius,
        y:(depth-1)*15,
        z:Math.sin(angle)*radius
      });
    });

    // Create files
    const fileMap={};
    repo.files.forEach((f,i)=>{
      const ft=FILE_TYPES[f.t]||{color:0x888888,geo:'sphere',size:1};
      const mesh=this.createFileMesh(f);

      const dir=this.dirs.find(d=>d.name===f.d)||{x:0,y:-10,z:0};
      const angle=Math.random()*Math.PI*2;
      const r=T.rnd(8,18);

      mesh.position.set(
        dir.x+Math.cos(angle)*r,
        dir.y+T.rnd(-5,5),
        dir.z+Math.sin(angle)*r
      );

      const ext=f.t;
      const snippet=CODE_SNIPPETS[ext]?T.pick(CODE_SNIPPETS[ext]):'// code...';
      const lines=Math.floor(T.rnd(50,800));
      const complexity=Math.floor(T.rnd(1,10));

      mesh.userData={
        name:f.n+(FILE_TYPES[f.t]?'.'+f.t:''),
        type:f.t,
        dir:f.d||'root',
        lines,
        complexity,
        imports:f.imp||[],
        snippet,
        idx:this.files.length,
        vel:T.v3(0,0,0)
      };

      this.sc.add(mesh);
      const file={mesh,...mesh.userData,ft};
      this.files.push(file);
      fileMap[f.n]=file;
    });

    // Create dependencies
    this.files.forEach(f=>{
      f.imports.forEach(impName=>{
        const target=fileMap[impName];
        if(target&&target!==f){
          this.deps.push({from:f,to:target});
        }
      });
    });

    this.createDepLines();
    this.generateCommits();
    this.updateUI();
    this.updateHotspots();
  },

  createDepLines(){
    this.depsGroup.clear();
    this.deps.forEach(d=>{
      const pts=[d.from.mesh.position.clone(),d.to.mesh.position.clone()];
      const mid=pts[0].clone().add(pts[1]).multiplyScalar(.5);
      mid.y+=15;

      const curve=new THREE.QuadraticBezierCurve3(pts[0],mid,pts[1]);
      const geo=new THREE.TubeGeometry(curve,20,.12,6);
      const mat=new THREE.MeshBasicMaterial({
        color:0x0066aa,
        transparent:true,
        opacity:.25
      });
      const tube=new THREE.Mesh(geo,mat);
      tube.userData={from:d.from,to:d.to,curve};
      this.depsGroup.add(tube);
    });
  },

  generateCommits(){
    this.commits=[];
    const timeline=document.getElementById('timeline');
    timeline.innerHTML='';

    const numCommits=Math.floor(T.rnd(20,50));
    const now=Date.now();
    const start=now-90*24*60*60*1000;// 90 days ago

    for(let i=0;i<numCommits;i++){
      const time=start+Math.random()*(now-start);
      const files=Math.floor(T.rnd(1,8));
      const additions=Math.floor(T.rnd(10,200));
      const deletions=Math.floor(T.rnd(0,50));

      this.commits.push({time,files,additions,deletions});

      const el=document.createElement('div');
      el.className='commit';
      el.style.left=((time-start)/(now-start)*100)+'%';
      el.style.height=(files*8)+'px';
      el.style.background=deletions>additions?'#f44':'#0f0';
      el.title=`${files} files, +${additions} -${deletions}`;
      timeline.appendChild(el);
    }

    document.getElementById('date-start').textContent='90d ago';
    document.getElementById('commits').textContent=numCommits;
  },

  physics(){
    if(!this.showForce)return;

    // Force-directed layout
    const k=.5,repel=500,attract=.01;

    this.files.forEach(f=>{
      const force=T.v3(0,0,0);

      // Repulsion from other files
      this.files.forEach(other=>{
        if(other===f)return;
        const diff=f.mesh.position.clone().sub(other.mesh.position);
        const dist=diff.length()||1;
        if(dist<50){
          diff.normalize().multiplyScalar(repel/(dist*dist));
          force.add(diff);
        }
      });

      // Attraction along deps
      this.deps.forEach(d=>{
        if(d.from===f||d.to===f){
          const other=d.from===f?d.to:d.from;
          const diff=other.mesh.position.clone().sub(f.mesh.position);
          const dist=diff.length();
          diff.normalize().multiplyScalar(dist*attract);
          force.add(diff);
        }
      });

      // Center gravity
      const toCenter=f.mesh.position.clone().negate();
      toCenter.multiplyScalar(.01);
      force.add(toCenter);

      // Apply
      f.vel.add(force.multiplyScalar(.02));
      f.vel.multiplyScalar(.9);// damping
      f.mesh.position.add(f.vel);
    });

    // Update dep lines periodically
    if(Math.random()<.1)this.createDepLines();
  },

  spawnParticle(dep){
    const geo=new THREE.SphereGeometry(.3);
    const mat=new THREE.MeshBasicMaterial({color:0x00ffff});
    const p=new THREE.Mesh(geo,mat);
    p.userData={curve:dep.curve,t:0,speed:T.rnd(.01,.03)};
    this.particleGroup.add(p);
    this.particles.push(p);
  },

  search(q){
    const results=document.getElementById('search-results');
    if(!q){results.innerHTML='';return}

    const matches=this.files.filter(f=>
      f.name.toLowerCase().includes(q.toLowerCase())||
      f.dir.toLowerCase().includes(q.toLowerCase())
    ).slice(0,10);

    results.innerHTML=matches.map(f=>{
      const col='#'+(FILE_TYPES[f.type]?.color||0x888888).toString(16).padStart(6,'0');
      return `<div class="search-item" onclick="S.focusFile(${f.idx})">
        <span style="color:${col}">●</span>${f.name}<span style="color:#666;margin-left:auto">${f.dir}</span>
      </div>`;
    }).join('');
  },

  focusFile(idx){
    const f=this.files[idx];
    if(!f)return;

    this.files.forEach(f=>f.mesh.material.emissiveIntensity=.15);
    f.mesh.material.emissiveIntensity=.8;
    this.selected=f;

    // Move camera toward file
    const target=f.mesh.position.clone().add(T.v3(30,20,30));
    this.targetCam=target;
  },

  toggleFlow(){
    this.showFlow=!this.showFlow;
    document.getElementById('btn-flow').classList.toggle('active');
  },

  toggleForce(){
    this.showForce=!this.showForce;
    document.getElementById('btn-force').classList.toggle('active');
  },

  toggleLabels(){
    this.showLabels=!this.showLabels;
  },

  explode(){
    this.files.forEach(f=>{
      const dir=f.mesh.position.clone().normalize();
      f.vel.add(dir.multiplyScalar(5));
    });
  },

  implode(){
    this.files.forEach(f=>{
      const dir=f.mesh.position.clone().normalize().negate();
      f.vel.add(dir.multiplyScalar(3));
    });
  },

  shake(){
    this.files.forEach(f=>{
      f.vel.add(T.v3(T.rnd(-3,3),T.rnd(-3,3),T.rnd(-3,3)));
    });
  },

  addRandomFile(){
    const types=Object.keys(FILE_TYPES);
    const t=T.pick(types);
    const ft=FILE_TYPES[t];
    const mesh=this.createFileMesh({t});

    mesh.position.set(T.rnd(-40,40),T.rnd(-10,30),T.rnd(-40,40));
    mesh.userData={
      name:'new_'+this.files.length+'.'+t,
      type:t,dir:'generated',
      lines:Math.floor(T.rnd(50,300)),
      complexity:Math.floor(T.rnd(1,10)),
      imports:[],snippet:'// new file',
      idx:this.files.length,
      vel:T.v3(0,0,0)
    };

    this.sc.add(mesh);
    this.files.push({mesh,...mesh.userData,ft});
    this.updateUI();
  },

  addRandomDep(){
    if(this.files.length<2)return;
    const from=T.pick(this.files);
    const to=T.pick(this.files);
    if(from!==to&&!this.deps.find(d=>d.from===from&&d.to===to)){
      this.deps.push({from,to});
      this.createDepLines();
      this.updateUI();
    }
  },

  clear(){
    this.files.forEach(f=>this.sc.remove(f.mesh));
    this.files=[];this.dirs=[];this.deps=[];
    this.depsGroup.clear();
    this.particleGroup.clear();
    this.particles=[];
    this.updateUI();
  },

  onMouse(e){
    this.mouse.x=(e.clientX/innerWidth)*2-1;
    this.mouse.y=-(e.clientY/innerHeight)*2+1;

    this.raycaster.setFromCamera(this.mouse,this.ca);
    const hits=this.raycaster.intersectObjects(this.files.map(f=>f.mesh));

    const tip=document.getElementById('tooltip');
    if(hits.length>0){
      const f=this.files.find(f=>f.mesh===hits[0].object);
      if(f){
        const col='#'+(FILE_TYPES[f.type]?.color||0x888888).toString(16).padStart(6,'0');
        tip.style.display='block';
        tip.style.left=e.clientX+15+'px';
        tip.style.top=e.clientY+15+'px';
        tip.innerHTML=`
          <div style="color:${col};font-size:14px;font-weight:bold">${f.name}</div>
          <div style="color:#888;font-size:10px">📁 ${f.dir}</div>
          <div style="margin-top:5px">
            <span class="metric" style="background:#0a0;color:#0f0">📝 ${f.lines} lines</span>
            <span class="metric" style="background:#a00;color:#f88">⚠️ ${f.complexity}/10</span>
            <span class="metric" style="background:#006;color:#08f">🔗 ${f.imports.length} imports</span>
          </div>
          <div class="code-preview" style="border-color:${col}">${f.snippet}</div>
        `;
      }
    }else{
      tip.style.display='none';
    }
  },

  onClick(e){
    this.raycaster.setFromCamera(this.mouse,this.ca);
    const hits=this.raycaster.intersectObjects(this.files.map(f=>f.mesh));

    this.files.forEach(f=>f.mesh.material.emissiveIntensity=.15);
    this.depsGroup.children.forEach(c=>{c.material.opacity=.25;c.material.color.setHex(0x0066aa)});

    if(hits.length>0){
      const f=this.files.find(f=>f.mesh===hits[0].object);
      if(f){
        f.mesh.material.emissiveIntensity=.8;
        this.selected=f;

        // Highlight deps
        this.depsGroup.children.forEach(c=>{
          if(c.userData.from===f||c.userData.to===f){
            c.material.opacity=.7;
            c.material.color.setHex(0x00ff88);
          }
        });
      }
    }else{
      this.selected=null;
    }
  },

  updateHotspots(){
    const sorted=[...this.files].sort((a,b)=>b.complexity-a.complexity).slice(0,5);
    document.getElementById('hotspots').innerHTML=sorted.map(f=>{
      const col='#'+(FILE_TYPES[f.type]?.color||0x888888).toString(16).padStart(6,'0');
      return `<div style="display:flex;align-items:center;gap:5px;padding:2px 0">
        <span style="color:${col}">●</span>
        <span>${f.name}</span>
        <span style="margin-left:auto;color:#f44">⚠️${f.complexity}</span>
      </div>`;
    }).join('');
  },

  updateUI(){
    document.getElementById('files').textContent=this.files.length;
    document.getElementById('dirs').textContent=this.dirs.length;
    document.getElementById('lines').textContent=this.files.reduce((a,f)=>a+f.lines,0);
    document.getElementById('deps').textContent=this.deps.length;
  },

  animate(){
    requestAnimationFrame(()=>this.animate());
    const t=Date.now()*.001;

    // Camera
    if(this.targetCam){
      this.ca.position.lerp(this.targetCam,.02);
      if(this.ca.position.distanceTo(this.targetCam)<1)this.targetCam=null;
    }else{
      const r=120+Math.sin(t*.15)*30;
      this.ca.position.x=Math.cos(t*.06)*r;
      this.ca.position.z=Math.sin(t*.06)*r;
      this.ca.position.y=60+Math.sin(t*.1)*15;
    }
    this.ca.lookAt(0,10,0);

    // Animate files
    this.files.forEach((f,i)=>{
      f.mesh.rotation.y+=.005;
      f.mesh.children[0].rotation.z+=.01;// ring
    });

    // Flow particles
    if(this.showFlow&&Math.random()<.1&&this.deps.length>0){
      const dep=T.pick(this.deps);
      const tube=this.depsGroup.children.find(c=>c.userData.from===dep.from&&c.userData.to===dep.to);
      if(tube)this.spawnParticle({curve:tube.userData.curve});
    }

    // Update particles
    for(let i=this.particles.length-1;i>=0;i--){
      const p=this.particles[i];
      p.userData.t+=p.userData.speed;
      if(p.userData.t>=1){
        this.particleGroup.remove(p);
        this.particles.splice(i,1);
      }else{
        const pos=p.userData.curve.getPoint(p.userData.t);
        p.position.copy(pos);
      }
    }

    // Pulse selected
    if(this.selected){
      this.selected.mesh.scale.setScalar(1+Math.sin(t*5)*.1);
    }

    this.rn.render(this.sc,this.ca);
  }
};

onload=()=>S.init();
onresize=()=>{S.rn.setSize(innerWidth,innerHeight);S.ca.aspect=innerWidth/innerHeight;S.ca.updateProjectionMatrix()};
</script></body></html>
