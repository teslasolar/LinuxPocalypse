<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gravity Well</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#000008;overflow:hidden;font:9px monospace;color:#aaf}
#c{position:fixed;inset:0}.p{position:absolute;background:rgba(0,0,20,.9);border:1px solid;border-radius:6px;padding:10px;z-index:10;backdrop-filter:blur(5px)}
.t{background:#000010;color:#88f;padding:6px;height:60px;overflow-y:auto;font-size:8px;border:1px solid #44f2;border-radius:3px}
button{background:linear-gradient(135deg,#44a,#228);color:#fff;border:0;padding:5px 8px;margin:2px;font-size:8px;border-radius:3px;cursor:pointer;font-weight:bold}
button:hover{filter:brightness(1.3)}
.r{background:linear-gradient(135deg,#a44,#622)}.g{background:linear-gradient(135deg,#4a4,#262)}.y{background:linear-gradient(135deg,#aa4,#662)}
.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(45px,1fr));gap:3px;margin:5px 0}
.s{padding:4px;text-align:center;border:1px solid;border-radius:3px;background:#0002;font-size:8px}
.bar{height:4px;background:#111;border-radius:2px;margin:2px 0}.fill{height:100%;border-radius:2px}
input[type=range]{width:100%;height:4px;-webkit-appearance:none;background:#224;border-radius:2px;margin:5px 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;background:#88f;border-radius:50%;cursor:pointer}
</style></head><body><canvas id="c"></canvas>

<div class="p" style="top:8px;left:8px;border-color:#88f;width:230px">
<div style="color:#88f;text-align:center;font-size:11px">🌌 GRAVITY WELL</div>
<div id="stats"></div>
<div id="energy"></div>
</div>

<div class="p" style="top:8px;right:8px;border-color:#fa0;width:260px">
<div style="color:#fa0;font-size:10px">🪐 SPAWN</div>
<div class="gr" id="bodies"></div>
<div style="margin-top:8px;font-size:8px">
<div>Time: <span id="timeVal">1.0</span>x</div>
<input type="range" id="timeScale" min="0" max="30" value="10" oninput="G.timeScale=this.value/10;document.getElementById('timeVal').textContent=G.timeScale.toFixed(1)">
<div>Gravity: <span id="gravVal">1.0</span>x</div>
<input type="range" id="gravScale" min="1" max="30" value="10" oninput="G.gravScale=this.value/10;document.getElementById('gravVal').textContent=G.gravScale.toFixed(1)">
</div>
<div class="gr">
<button class="g" onclick="G.chaos()">🌀Chaos</button>
<button class="y" onclick="G.align()">📐Align</button>
<button class="r" onclick="G.clear()">🗑️Clear</button>
<button onclick="G.pause=!G.pause">⏯️</button>
</div>
<div id="log" class="t"></div>
</div>

<div class="p" style="bottom:8px;left:8px;border-color:#0ff;width:230px">
<div style="color:#0ff;font-size:10px">📊 SYSTEM</div>
<div id="system"></div>
</div>

<div class="p" style="bottom:8px;right:8px;border-color:#f0f;width:230px">
<div style="color:#f0f;font-size:10px">🎯 SELECTED</div>
<div id="selected"></div>
</div>

<script>
const T={
  τ:Math.PI*2,π:Math.PI,
  G:0.5, // Gravitational constant
  rng:(a=0,b=1)=>a+(b-a)*Math.random(),
  rngInt:(a,b)=>Math.floor(T.rng(a,b+1)),
  v3:(x=0,y=0,z=0)=>new THREE.Vector3(x,y,z),
  hsl:(h,s=.7,l=.5)=>new THREE.Color().setHSL(h,s,l),
  $:id=>document.getElementById(id),
  html:(id,h)=>T.$(id).innerHTML=h,
  log:(id,m)=>{const e=T.$(id);e.textContent+=m+'\n';e.scrollTop=e.scrollHeight}
};

// Body types: [name, icon, color, mass, radius, canOrbit]
const BODIES={
  star:['Star','☀️',0xffaa00,1000,5,false],
  giant:['Gas Giant','🪐',0xdd8844,100,3,true],
  planet:['Planet','🌍',0x4488ff,20,1.5,true],
  moon:['Moon','🌙',0xaaaaaa,2,.6,true],
  asteroid:['Asteroid','🪨',0x666666,.5,.3,true],
  comet:['Comet','☄️',0x88ffff,1,.4,true],
  dwarf:['Dwarf','⚫',0x886644,5,.8,true],
  station:['Station','🛰️',0x44ff88,.2,.25,true]
};

const G={
  bodies:[],
  trails:new Map(),
  bodyId:0,
  timeScale:1,
  gravScale:1,
  pause:false,
  selected:null,
  totalMass:0,

  W:{
    scene:null,camera:null,renderer:null,
    starLight:null,

    init(){
      this.scene=new THREE.Scene();
      this.camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,2000);
      this.renderer=new THREE.WebGLRenderer({canvas:T.$('c'),antialias:true});
      this.renderer.setSize(innerWidth,innerHeight);
      this.renderer.setClearColor(0x000008);
      this.camera.position.set(0,80,80);
      this.camera.lookAt(0,0,0);

      // Ambient starlight
      this.scene.add(new THREE.AmbientLight(0x202040,.3));

      // Star field background
      this.createStarfield();

      // Orbital grid
      const grid=new THREE.GridHelper(200,20,0x111133,0x080818);
      grid.rotation.x=T.π/2;
      this.scene.add(grid);

      this.scene.fog=new THREE.FogExp2(0x000008,.003);
      this.animate();
    },

    createStarfield(){
      const geo=new THREE.BufferGeometry();
      const count=2000;
      const pos=new Float32Array(count*3);
      const col=new Float32Array(count*3);
      for(let i=0;i<count;i++){
        const r=200+Math.random()*500;
        const θ=Math.random()*T.τ;
        const φ=Math.random()*T.π;
        pos[i*3]=r*Math.sin(φ)*Math.cos(θ);
        pos[i*3+1]=r*Math.cos(φ);
        pos[i*3+2]=r*Math.sin(φ)*Math.sin(θ);
        const c=T.hsl(Math.random(),.3,.5+Math.random()*.5);
        col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;
      }
      geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
      geo.setAttribute('color',new THREE.BufferAttribute(col,3));
      const stars=new THREE.Points(geo,new THREE.PointsMaterial({size:.8,vertexColors:true}));
      this.scene.add(stars);
    },

    createBody(type,pos,vel){
      const[name,icon,color,mass,radius]=BODIES[type];
      const group=new THREE.Group();

      // Main sphere
      const geo=new THREE.SphereGeometry(radius,24,18);
      const mat=new THREE.MeshPhongMaterial({
        color,
        emissive:type==='star'?color:0x000000,
        emissiveIntensity:type==='star'?1:.1,
        shininess:type==='star'?0:60
      });
      const mesh=new THREE.Mesh(geo,mat);
      group.add(mesh);

      // Atmosphere/glow for planets
      if(type!=='asteroid'&&type!=='station'){
        const glowGeo=new THREE.SphereGeometry(radius*1.15,16,12);
        const glowMat=new THREE.MeshBasicMaterial({
          color,transparent:true,opacity:.15,side:THREE.BackSide
        });
        const glow=new THREE.Mesh(glowGeo,glowMat);
        group.add(glow);
      }

      // Rings for gas giants
      if(type==='giant'){
        const ringGeo=new THREE.RingGeometry(radius*1.4,radius*2.2,32);
        const ringMat=new THREE.MeshBasicMaterial({
          color:0xaa8866,transparent:true,opacity:.4,side:THREE.DoubleSide
        });
        const ring=new THREE.Mesh(ringGeo,ringMat);
        ring.rotation.x=T.π/2+T.rng(-.3,.3);
        group.add(ring);
      }

      // Comet tail
      if(type==='comet'){
        const tailGeo=new THREE.ConeGeometry(.2,4,8);
        const tailMat=new THREE.MeshBasicMaterial({color:0x88ffff,transparent:true,opacity:.4});
        const tail=new THREE.Mesh(tailGeo,tailMat);
        tail.rotation.x=-T.π/2;
        tail.position.z=2;
        group.add(tail);
        group.tail=tail;
      }

      // Star light source
      if(type==='star'){
        const light=new THREE.PointLight(color,2,150);
        group.add(light);
        this.starLight=light;

        // Corona
        const coronaGeo=new THREE.SphereGeometry(radius*1.5,16,12);
        const coronaMat=new THREE.MeshBasicMaterial({
          color:0xffdd88,transparent:true,opacity:.2
        });
        const corona=new THREE.Mesh(coronaGeo,coronaMat);
        group.add(corona);
      }

      group.position.copy(pos);
      this.scene.add(group);
      return group;
    },

    createTrail(color){
      const maxPoints=100;
      const positions=new Float32Array(maxPoints*3);
      const geo=new THREE.BufferGeometry();
      geo.setAttribute('position',new THREE.BufferAttribute(positions,3));
      geo.setDrawRange(0,0);

      const mat=new THREE.LineBasicMaterial({color,transparent:true,opacity:.4});
      const line=new THREE.Line(geo,mat);
      this.scene.add(line);
      return{line,points:[],maxPoints};
    },

    updateTrail(trail,pos){
      trail.points.unshift(pos.clone());
      if(trail.points.length>trail.maxPoints)trail.points.pop();

      const positions=trail.line.geometry.attributes.position.array;
      for(let i=0;i<trail.points.length;i++){
        positions[i*3]=trail.points[i].x;
        positions[i*3+1]=trail.points[i].y;
        positions[i*3+2]=trail.points[i].z;
      }
      trail.line.geometry.attributes.position.needsUpdate=true;
      trail.line.geometry.setDrawRange(0,trail.points.length);
    },

    animate(){
      requestAnimationFrame(()=>this.animate());
      const t=Date.now()*.001;

      // Camera
      if(!G.selected){
        const r=100;
        this.camera.position.x=Math.cos(t*.05)*r;
        this.camera.position.z=Math.sin(t*.05)*r;
        this.camera.position.y=50+Math.sin(t*.08)*20;
        this.camera.lookAt(0,0,0);
      }else{
        // Follow selected body
        const b=G.selected;
        this.camera.position.lerp(T.v3(b.pos.x+30,b.pos.y+20,b.pos.z+30),.05);
        this.camera.lookAt(b.pos);
      }

      // Body rotations
      G.bodies.forEach(b=>{
        if(b.mesh){
          b.mesh.rotation.y+=.01/Math.sqrt(b.mass);
          // Comet tail always points away from nearest star
          if(b.mesh.tail){
            const star=G.bodies.find(s=>s.type==='star');
            if(star){
              const dir=T.v3().subVectors(b.pos,star.pos).normalize();
              b.mesh.tail.rotation.y=Math.atan2(dir.x,dir.z);
            }
          }
        }
      });

      this.renderer.render(this.scene,this.camera);
    }
  },

  spawn(type){
    const def=BODIES[type];
    const id=++this.bodyId;

    // Position - orbital distance based on type
    let pos,vel;
    if(type==='star'){
      pos=T.v3(0,0,0);
      vel=T.v3(0,0,0);
    }else{
      const star=this.bodies.find(b=>b.type==='star');
      const r=15+this.bodies.length*8+T.rng(0,10);
      const θ=T.rng(0,T.τ);
      pos=T.v3(Math.cos(θ)*r,T.rng(-5,5),Math.sin(θ)*r);

      // Orbital velocity
      if(star){
        const dist=pos.length();
        const orbitalSpeed=Math.sqrt(T.G*star.mass*this.gravScale/dist)*.5;
        // Perpendicular to radius
        vel=T.v3(-Math.sin(θ)*orbitalSpeed,0,Math.cos(θ)*orbitalSpeed);
      }else{
        vel=T.v3(T.rng(-1,1),0,T.rng(-1,1));
      }
    }

    const mesh=this.W.createBody(type,pos,vel);
    const trail=type!=='star'?this.W.createTrail(def[2]):null;

    const body={
      id,type,mesh,trail,
      pos:pos.clone(),
      vel:vel.clone(),
      mass:def[3],
      radius:def[4],
      age:0
    };

    this.bodies.push(body);
    this.totalMass+=def[3];

    T.log('log',`+${def[1]}${def[0]}#${id}`);
    this.updateUI();
    return body;
  },

  physics(){
    if(this.pause)return;

    const dt=0.016*this.timeScale;
    const G_const=T.G*this.gravScale;

    // Calculate gravitational forces
    this.bodies.forEach(a=>{
      if(a.mass<=0)return;
      const acc=T.v3();

      this.bodies.forEach(b=>{
        if(a===b||b.mass<=0)return;
        const dir=T.v3().subVectors(b.pos,a.pos);
        const distSq=Math.max(dir.lengthSq(),1);
        const force=G_const*b.mass/distSq;
        dir.normalize().multiplyScalar(force);
        acc.add(dir);
      });

      // Update velocity and position
      a.vel.add(acc.multiplyScalar(dt));
      a.pos.add(a.vel.clone().multiplyScalar(dt));
      a.mesh.position.copy(a.pos);
      a.age+=dt;

      // Update trail
      if(a.trail&&a.age>.1){
        this.W.updateTrail(a.trail,a.pos);
      }
    });

    // Collision detection
    for(let i=0;i<this.bodies.length;i++){
      for(let j=i+1;j<this.bodies.length;j++){
        const a=this.bodies[i];
        const b=this.bodies[j];
        const dist=a.pos.distanceTo(b.pos);
        const minDist=a.radius+b.radius;

        if(dist<minDist){
          // Merge - smaller absorbed by larger
          const[big,small]=a.mass>b.mass?[a,b]:[b,a];
          big.mass+=small.mass*.5;
          big.vel.lerp(small.vel,small.mass/(big.mass+small.mass));
          this.remove(small);
          T.log('log',`💥 Collision! ${BODIES[small.type][0]} absorbed`);
        }
      }
    }

    this.updateUI();
  },

  remove(body){
    this.W.scene.remove(body.mesh);
    if(body.trail)this.W.scene.remove(body.trail.line);
    const idx=this.bodies.indexOf(body);
    if(idx>-1)this.bodies.splice(idx,1);
    this.totalMass-=body.mass;
    if(this.selected===body)this.selected=null;
  },

  chaos(){
    this.bodies.forEach(b=>{
      if(b.type!=='star'){
        b.vel.x+=T.rng(-2,2);
        b.vel.z+=T.rng(-2,2);
      }
    });
    T.log('log','🌀 Chaos applied!');
  },

  align(){
    // Reset all to circular orbits
    const star=this.bodies.find(b=>b.type==='star');
    if(!star)return;

    this.bodies.forEach(b=>{
      if(b.type==='star')return;
      const dist=b.pos.distanceTo(star.pos);
      const orbitalSpeed=Math.sqrt(T.G*star.mass*this.gravScale/dist)*.5;
      const θ=Math.atan2(b.pos.z,b.pos.x);
      b.vel.set(-Math.sin(θ)*orbitalSpeed,0,Math.cos(θ)*orbitalSpeed);
      b.pos.y*=.1; // Flatten to orbital plane
    });
    T.log('log','📐 Orbits aligned');
  },

  clear(){
    [...this.bodies].forEach(b=>this.remove(b));
    this.bodyId=0;
    this.totalMass=0;
    T.log('log','🗑️ Cleared');
    this.updateUI();
  },

  updateUI(){
    const ke=this.bodies.reduce((s,b)=>s+.5*b.mass*b.vel.lengthSq(),0);
    const starCount=this.bodies.filter(b=>b.type==='star').length;

    T.html('stats',`
      <div class="gr">
        <div class="s" style="border-color:#fa0">☀️${starCount}</div>
        <div class="s" style="border-color:#48f">🪐${this.bodies.length-starCount}</div>
        <div class="s" style="border-color:#f0f">⚖${this.totalMass.toFixed(0)}</div>
      </div>
    `);

    T.html('energy',`
      <div style="font-size:8px">Kinetic: ${ke.toFixed(1)}</div>
      <div class="bar"><div class="fill" style="width:${Math.min(100,ke/10)}%;background:linear-gradient(90deg,#44a,#a4f)"></div></div>
    `);

    T.html('bodies',Object.entries(BODIES).map(([k,v])=>
      `<button onclick="G.spawn('${k}')">${v[1]}</button>`
    ).join(''));

    // System overview
    const byType={};
    this.bodies.forEach(b=>byType[b.type]=(byType[b.type]||0)+1);
    T.html('system',Object.entries(byType).map(([t,n])=>
      `<div style="font-size:8px;color:#${BODIES[t][2].toString(16).padStart(6,'0')}">${BODIES[t][1]} ${BODIES[t][0]}: ${n}</div>`
    ).join('')||'<div style="color:#555">Empty space</div>');

    // Selected body info
    if(this.selected){
      const b=this.selected;
      T.html('selected',`
        <div style="font-size:9px;color:#${BODIES[b.type][2].toString(16).padStart(6,'0')}">${BODIES[b.type][1]} ${BODIES[b.type][0]} #${b.id}</div>
        <div style="font-size:8px">Mass: ${b.mass.toFixed(1)}</div>
        <div style="font-size:8px">Vel: ${b.vel.length().toFixed(2)}</div>
        <div style="font-size:8px">Dist: ${b.pos.length().toFixed(1)}</div>
        <button class="r" onclick="G.remove(G.selected)">🗑️Destroy</button>
      `);
    }else{
      T.html('selected','<div style="color:#555;font-size:8px">Click a body to select</div>');
    }
  },

  init(){
    this.W.init();
    T.log('log','🌌 Gravity Well v1');
    T.log('log','Spawn bodies, watch orbits!');

    // Initial solar system
    setTimeout(()=>this.spawn('star'),200);
    setTimeout(()=>this.spawn('planet'),400);
    setTimeout(()=>this.spawn('planet'),600);
    setTimeout(()=>this.spawn('giant'),800);
    setTimeout(()=>this.spawn('moon'),1000);

    setInterval(()=>this.physics(),16);
    this.updateUI();
  }
};

onload=()=>setTimeout(()=>G.init(),100);
onresize=()=>{G.W.renderer.setSize(innerWidth,innerHeight);G.W.camera.aspect=innerWidth/innerHeight;G.W.camera.updateProjectionMatrix()};
</script></body></html>
