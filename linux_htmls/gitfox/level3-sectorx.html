<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Git Fox - Level 3: Sector X</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;overflow:hidden;font:bold 14px monospace;color:#0f0}
#c{position:fixed;inset:0}
.hud{position:fixed;z-index:10;pointer-events:none}
#shield-bar{top:20px;left:20px;width:200px;height:20px;border:2px solid #0f0;background:#001a00}
#shield-fill{height:100%;background:linear-gradient(90deg,#f00,#ff0,#0f0);width:100%;transition:width .2s}
#shield-label{top:22px;left:230px;color:#0f0;font-size:12px}
#boost-bar{top:50px;left:20px;width:150px;height:12px;border:2px solid #08f;background:#001020}
#boost-fill{height:100%;background:#08f;width:100%}
#boost-label{top:50px;left:180px;color:#08f;font-size:11px}
#score{top:20px;right:20px;font-size:24px;color:#ff0;text-align:right}
#bombs{top:55px;right:20px;font-size:16px;color:#f80}
#lives{bottom:20px;left:20px;font-size:20px;color:#0f0}
#level-title{top:100px;left:50%;transform:translateX(-50%);font-size:28px;color:#f0f;text-shadow:0 0 10px #f0f;opacity:0;transition:opacity 1s}
#crosshair{top:50%;left:50%;transform:translate(-50%,-50%);width:60px;height:60px}
#radio{bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,20,0,.9);border:2px solid #0f0;border-radius:8px;padding:10px 20px;opacity:0;transition:opacity .5s}
#radio-face{width:50px;height:50px;border:2px solid #0a0;border-radius:50%;background:#001a00;float:left;margin-right:15px;display:flex;align-items:center;justify-content:center;font-size:24px}
#radio-text{color:#0f0;font-size:14px;max-width:300px}
#controls{bottom:20px;right:20px;font-size:10px;color:#888;text-align:right}
#game-over{top:50%;left:50%;transform:translate(-50%,-50%);font-size:48px;color:#f00;text-shadow:0 0 20px #f00;display:none}
#mission-complete{top:50%;left:50%;transform:translate(-50%,-50%);font-size:36px;color:#0f0;text-shadow:0 0 20px #0f0;display:none;text-align:center}
#warning{top:50%;left:50%;transform:translate(-50%,-50%);font-size:24px;color:#f80;text-shadow:0 0 10px #f80;opacity:0;transition:opacity .3s}
</style></head><body><canvas id="c"></canvas>

<div class="hud" id="shield-bar"><div id="shield-fill"></div></div>
<div class="hud" id="shield-label">SHIELD</div>

<div class="hud" id="boost-bar"><div id="boost-fill"></div></div>
<div class="hud" id="boost-label">BOOST</div>

<div class="hud" id="score">00000</div>
<div class="hud" id="bombs">BOMBS: 3</div>
<div class="hud" id="lives">♦ ♦ ♦</div>

<div class="hud" id="level-title">LEVEL 3: SECTOR X</div>
<div class="hud" id="warning">⚠️ DANGER ZONE ⚠️</div>

<svg class="hud" id="crosshair" viewBox="0 0 60 60">
<circle cx="30" cy="30" r="25" stroke="#0f0" stroke-width="2" fill="none" opacity="0.5"/>
<line x1="30" y1="0" x2="30" y2="20" stroke="#0f0" stroke-width="2"/>
<line x1="30" y1="40" x2="30" y2="60" stroke="#0f0" stroke-width="2"/>
<line x1="0" y1="30" x2="20" y2="30" stroke="#0f0" stroke-width="2"/>
<line x1="40" y1="30" x2="60" y2="30" stroke="#0f0" stroke-width="2"/>
<circle cx="30" cy="30" r="3" fill="#0f0"/>
</svg>

<div class="hud" id="radio">
<div id="radio-face">🦊</div>
<div id="radio-text">Entering Sector X...</div>
</div>

<div class="hud" id="game-over">GAME OVER</div>
<div class="hud" id="mission-complete">MISSION COMPLETE<br><span style="font-size:20px">Score: <span id="final-score">0</span></span></div>

<div class="hud" id="controls">
WASD/LStick: Move | L3: Barrel Roll<br>
Mouse/RStick: Aim | Click/RB: Fire | B: Bomb
</div>

<script>
const T={v3:(x,y,z)=>new THREE.Vector3(x,y,z),rnd:(a,b)=>a+Math.random()*(b-a),clamp:(v,a,b)=>Math.max(a,Math.min(b,v)),lerp:(a,b,t)=>a+(b-a)*t};

const G={
  shield:100,
  boost:100,
  score:0,
  bombs:3,
  lives:3,
  distance:0,
  levelLength:4500,
  gameOver:false,
  complete:false,
  barrelRolling:false,
  barrelRollTimer:0,
  invincible:0,

  enemies:[],
  bullets:[],
  debris:[],
  particles:[],
  turrets:[],
  beams:[],

  input:{lx:0,ly:0,rx:0,ry:0,buttons:{}},
  mouse:{x:0,y:0,locked:false},
  keys:{},
  gamepad:null,

  shipX:0,
  shipY:0,
  shipTargetX:0,
  shipTargetY:0,

  init(){
    this.sc=new THREE.Scene();
    this.ca=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,3000);
    this.rn=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
    this.rn.setSize(innerWidth,innerHeight);
    this.rn.setClearColor(0x080010);

    // Eerie purple lighting
    this.sc.add(new THREE.AmbientLight(0x220044,.3));
    const main=new THREE.DirectionalLight(0xaa88ff,.6);
    main.position.set(50,30,-50);
    this.sc.add(main);
    const red=new THREE.PointLight(0xff2200,.5,200);
    red.position.set(-50,20,-100);
    this.sc.add(red);

    // Starfield
    this.createStarfield();

    // Damaged space station sections
    this.createStationDebris();

    // Player ship
    this.ship=this.createShip();
    this.ship.position.set(0,0,0);
    this.sc.add(this.ship);

    // Camera
    this.ca.position.set(0,10,30);
    this.ca.lookAt(0,0,-50);

    // Input
    window.addEventListener('gamepadconnected',e=>this.gamepad=e.gamepad);
    window.addEventListener('gamepaddisconnected',()=>this.gamepad=null);
    window.addEventListener('keydown',e=>{
      this.keys[e.code]=true;
      if(e.code==='KeyQ'||e.code==='ShiftLeft')this.barrelRoll();
      if(e.code==='KeyB')this.useBomb();
    });
    window.addEventListener('keyup',e=>this.keys[e.code]=false);
    document.addEventListener('click',()=>{
      if(!this.mouse.locked)document.body.requestPointerLock();
      else this.fire();
    });
    document.addEventListener('pointerlockchange',()=>{
      this.mouse.locked=!!document.pointerLockElement;
    });
    document.addEventListener('mousemove',e=>{
      if(this.mouse.locked){
        this.mouse.x+=e.movementX*.002;
        this.mouse.y+=e.movementY*.002;
        this.mouse.x=T.clamp(this.mouse.x,-1,1);
        this.mouse.y=T.clamp(this.mouse.y,-1,1);
      }
    });

    // Level intro
    setTimeout(()=>{
      document.getElementById('level-title').style.opacity=1;
      this.showRadio('🦊','This is Sector X... Something terrible happened here.');
    },500);
    setTimeout(()=>document.getElementById('level-title').style.opacity=0,3500);

    this.animate();
  },

  createShip(){
    const g=new THREE.Group();

    // Main body - nose pointing forward
    const body=new THREE.Mesh(
      new THREE.ConeGeometry(1.5,6,4),
      new THREE.MeshPhongMaterial({color:0xcccccc})
    );
    body.rotation.x=-Math.PI/2;
    body.rotation.y=Math.PI/4;
    g.add(body);

    // Wings
    const wingGeo=new THREE.BoxGeometry(8,.2,2);
    const wingMat=new THREE.MeshPhongMaterial({color:0x4444ff});
    const leftWing=new THREE.Mesh(wingGeo,wingMat);
    leftWing.position.set(-2,0,1);
    leftWing.rotation.z=.1;
    g.add(leftWing);

    const rightWing=new THREE.Mesh(wingGeo,wingMat);
    rightWing.position.set(2,0,1);
    rightWing.rotation.z=-.1;
    g.add(rightWing);

    // Wing tips
    const tipMat=new THREE.MeshPhongMaterial({color:0xff0000});
    const leftTip=new THREE.Mesh(new THREE.BoxGeometry(1,.3,.5),tipMat);
    leftTip.position.set(-5.5,0,1);
    g.add(leftTip);
    const rightTip=new THREE.Mesh(new THREE.BoxGeometry(1,.3,.5),tipMat);
    rightTip.position.set(5.5,0,1);
    g.add(rightTip);

    // Cockpit
    const cockpit=new THREE.Mesh(
      new THREE.SphereGeometry(.8,8,8),
      new THREE.MeshPhongMaterial({color:0x00ff88,emissive:0x004422})
    );
    cockpit.position.z=-1;
    cockpit.scale.set(1,.5,1);
    g.add(cockpit);

    // Engines with glow
    for(let i=-1;i<=1;i+=2){
      const eng=new THREE.Mesh(
        new THREE.CylinderGeometry(.3,.5,1.5),
        new THREE.MeshPhongMaterial({color:0x666666})
      );
      eng.rotation.x=Math.PI/2;
      eng.position.set(i*1.5,-.3,3);
      g.add(eng);

      const glow=new THREE.Mesh(
        new THREE.CylinderGeometry(.2,.4,.5),
        new THREE.MeshBasicMaterial({color:0x00aaff})
      );
      glow.rotation.x=Math.PI/2;
      glow.position.set(i*1.5,-.3,3.8);
      glow.userData.isGlow=true;
      g.add(glow);
    }

    return g;
  },

  createStarfield(){
    const starGeo=new THREE.BufferGeometry();
    const starPos=[];
    for(let i=0;i<1500;i++){
      starPos.push(
        T.rnd(-600,600),
        T.rnd(-400,400),
        T.rnd(-1200,100)
      );
    }
    starGeo.setAttribute('position',new THREE.Float32BufferAttribute(starPos,3));
    this.starField=new THREE.Points(
      starGeo,
      new THREE.PointsMaterial({color:0x8888ff,size:.8})
    );
    this.sc.add(this.starField);
  },

  createStationDebris(){
    // Create initial debris field
    for(let i=0;i<25;i++){
      this.spawnDebris(-50-i*40);
    }
    // Some turrets on debris
    for(let i=0;i<8;i++){
      this.spawnTurret(-200-i*100);
    }
  },

  spawnDebris(z){
    const types=['hull','beam','panel','module'];
    const type=types[Math.floor(Math.random()*types.length)];
    let mesh;

    if(type==='hull'){
      // Curved hull section
      mesh=new THREE.Mesh(
        new THREE.CylinderGeometry(T.rnd(8,20),T.rnd(8,20),T.rnd(15,40),8,1,true,0,Math.PI),
        new THREE.MeshPhongMaterial({color:0x445566,side:THREE.DoubleSide})
      );
    }else if(type==='beam'){
      // Structural beam
      mesh=new THREE.Mesh(
        new THREE.BoxGeometry(T.rnd(2,5),T.rnd(2,5),T.rnd(20,60)),
        new THREE.MeshPhongMaterial({color:0x556677})
      );
    }else if(type==='panel'){
      // Flat panel
      mesh=new THREE.Mesh(
        new THREE.BoxGeometry(T.rnd(10,25),T.rnd(10,25),1),
        new THREE.MeshPhongMaterial({color:0x334455})
      );
    }else{
      // Damaged module
      const g=new THREE.Group();
      const box=new THREE.Mesh(
        new THREE.BoxGeometry(T.rnd(8,15),T.rnd(8,15),T.rnd(8,15)),
        new THREE.MeshPhongMaterial({color:0x445566})
      );
      g.add(box);
      // Sparking damage
      if(Math.random()>.5){
        const spark=new THREE.Mesh(
          new THREE.SphereGeometry(1),
          new THREE.MeshBasicMaterial({color:0xff4400})
        );
        spark.position.set(T.rnd(-5,5),T.rnd(-5,5),T.rnd(-5,5));
        spark.userData.isSpark=true;
        g.add(spark);
      }
      mesh=g;
    }

    mesh.position.set(T.rnd(-100,100),T.rnd(-60,60),z);
    mesh.rotation.set(T.rnd(0,Math.PI*2),T.rnd(0,Math.PI*2),T.rnd(0,Math.PI*2));
    mesh.userData={
      rotSpeed:T.v3(T.rnd(-.01,.01),T.rnd(-.01,.01),T.rnd(-.01,.01)),
      size:type==='hull'?20:type==='module'?15:10
    };
    this.sc.add(mesh);
    this.debris.push(mesh);
  },

  spawnTurret(z){
    const g=new THREE.Group();
    // Base
    const base=new THREE.Mesh(
      new THREE.CylinderGeometry(4,5,3,8),
      new THREE.MeshPhongMaterial({color:0x664422})
    );
    g.add(base);
    // Barrel
    const barrel=new THREE.Mesh(
      new THREE.CylinderGeometry(.5,.5,8,6),
      new THREE.MeshPhongMaterial({color:0x444444})
    );
    barrel.rotation.x=Math.PI/2;
    barrel.position.z=-4;
    barrel.position.y=1;
    g.add(barrel);
    // Targeting light
    const light=new THREE.Mesh(
      new THREE.SphereGeometry(.8),
      new THREE.MeshBasicMaterial({color:0xff0000})
    );
    light.position.set(0,2,0);
    light.userData.isLight=true;
    g.add(light);

    g.position.set(T.rnd(-70,70),T.rnd(-30,30),z);
    g.userData={
      fireTimer:T.rnd(0,100),
      hp:3
    };
    this.sc.add(g);
    this.turrets.push(g);
  },

  spawnEnemy(type='drone'){
    const enemy={type,hp:type==='drone'?2:type==='bomber'?4:3};

    if(type==='drone'){
      // Small attack drone
      const g=new THREE.Group();
      const body=new THREE.Mesh(
        new THREE.OctahedronGeometry(2),
        new THREE.MeshPhongMaterial({color:0x880088})
      );
      g.add(body);
      // Glow core
      const core=new THREE.Mesh(
        new THREE.SphereGeometry(.5),
        new THREE.MeshBasicMaterial({color:0xff00ff})
      );
      g.add(core);
      enemy.mesh=g;
      enemy.mesh.position.set(T.rnd(-60,60),T.rnd(-30,30),-400);
      enemy.vx=T.rnd(-.5,.5);
      enemy.vy=T.rnd(-.3,.3);
    }else if(type==='bomber'){
      // Heavy bomber
      const g=new THREE.Group();
      const body=new THREE.Mesh(
        new THREE.BoxGeometry(6,3,10),
        new THREE.MeshPhongMaterial({color:0x666688})
      );
      g.add(body);
      // Engines
      for(let i=-1;i<=1;i+=2){
        const eng=new THREE.Mesh(
          new THREE.CylinderGeometry(1,1,3),
          new THREE.MeshBasicMaterial({color:0xff6600})
        );
        eng.rotation.x=Math.PI/2;
        eng.position.set(i*2,0,6);
        g.add(eng);
      }
      enemy.mesh=g;
      enemy.mesh.position.set(T.rnd(-50,50),T.rnd(-20,20),-450);
      enemy.vx=0;
      enemy.vy=0;
    }else if(type==='ring'){
      // Bonus ring - NO rotation.y so player can fly through!
      enemy.mesh=new THREE.Mesh(
        new THREE.TorusGeometry(10,1.2,8,20),
        new THREE.MeshPhongMaterial({color:0xffff00,emissive:0x666600})
      );
      enemy.mesh.position.set(T.rnd(-35,35),T.rnd(-20,20),-320);
      // Ring spins around Z but faces player (no Y rotation)
      enemy.isRing=true;
    }

    this.sc.add(enemy.mesh);
    this.enemies.push(enemy);
  },

  fire(){
    if(this.gameOver||this.complete)return;

    const bullet=new THREE.Mesh(
      new THREE.SphereGeometry(.3),
      new THREE.MeshBasicMaterial({color:0x00ff00})
    );
    bullet.position.copy(this.ship.position);
    bullet.position.z-=5;

    const aimX=this.shipX*30;
    const aimY=this.shipY*20;
    bullet.userData={
      vel:T.v3(aimX*.02,-aimY*.02,-3),
      life:80
    };

    this.sc.add(bullet);
    this.bullets.push(bullet);
  },

  useBomb(){
    if(this.bombs<=0||this.gameOver)return;
    this.bombs--;
    document.getElementById('bombs').textContent='BOMBS: '+this.bombs;

    // Destroy all enemies and beams
    this.enemies.forEach(e=>{
      if(!e.isRing){
        this.spawnExplosion(e.mesh.position);
        this.sc.remove(e.mesh);
        e.dead=true;
        this.addScore(e.type==='drone'?20:60);
      }
    });
    this.enemies=this.enemies.filter(e=>!e.dead);

    // Destroy turrets
    this.turrets.forEach(t=>{
      if(t.position.z>-200&&t.position.z<50){
        this.spawnExplosion(t.position);
        this.sc.remove(t);
        t.userData.dead=true;
        this.addScore(30);
      }
    });
    this.turrets=this.turrets.filter(t=>!t.userData.dead);

    // Clear beams
    this.beams.forEach(b=>{this.sc.remove(b);b.userData.dead=true});
    this.beams=[];

    document.body.style.background='#fff';
    setTimeout(()=>document.body.style.background='#000',100);
  },

  barrelRoll(){
    if(this.barrelRolling||this.boost<20)return;
    this.barrelRolling=true;
    this.barrelRollTimer=0;
    this.boost-=20;
    this.invincible=30;
  },

  spawnExplosion(pos){
    for(let i=0;i<25;i++){
      const p=new THREE.Mesh(
        new THREE.SphereGeometry(.5),
        new THREE.MeshBasicMaterial({color:Math.random()>.3?0xff00ff:0xffff00})
      );
      p.position.copy(pos);
      p.userData={
        vel:T.v3(T.rnd(-1.5,1.5),T.rnd(-1.5,1.5),T.rnd(-1.5,1.5)),
        life:45
      };
      this.sc.add(p);
      this.particles.push(p);
    }
  },

  addScore(pts){
    this.score+=pts;
    document.getElementById('score').textContent=String(this.score).padStart(5,'0');
  },

  takeDamage(amt){
    if(this.invincible>0)return;
    this.shield-=amt;
    this.invincible=30;
    document.getElementById('shield-fill').style.width=Math.max(0,this.shield)+'%';

    // Flash warning
    const warn=document.getElementById('warning');
    warn.style.opacity=1;
    setTimeout(()=>warn.style.opacity=0,200);

    if(this.shield<=0){
      this.lives--;
      if(this.lives<=0){
        this.gameOver=true;
        document.getElementById('game-over').style.display='block';
      }else{
        this.shield=100;
        document.getElementById('shield-fill').style.width='100%';
        this.updateLives();
      }
    }
  },

  updateLives(){
    document.getElementById('lives').textContent='♦ '.repeat(this.lives).trim();
  },

  showRadio(face,text){
    const radio=document.getElementById('radio');
    document.getElementById('radio-face').textContent=face;
    document.getElementById('radio-text').textContent=text;
    radio.style.opacity=1;
    setTimeout(()=>radio.style.opacity=0,4000);
  },

  pollGamepad(){
    const gps=navigator.getGamepads();
    if(gps[0])this.gamepad=gps[0];
    if(!this.gamepad)return;

    const gp=this.gamepad;
    const dz=.15;

    this.input.lx=Math.abs(gp.axes[0])<dz?0:gp.axes[0];
    this.input.ly=Math.abs(gp.axes[1])<dz?0:gp.axes[1];
    this.input.rx=Math.abs(gp.axes[2])<dz?0:gp.axes[2];
    this.input.ry=Math.abs(gp.axes[3])<dz?0:gp.axes[3];

    const wasRB=this.input.buttons.rb;
    const wasL3=this.input.buttons.l3;
    const wasB=this.input.buttons.b;
    this.input.buttons.rb=gp.buttons[5]?.pressed;
    this.input.buttons.l3=gp.buttons[10]?.pressed;
    this.input.buttons.b=gp.buttons[1]?.pressed;

    if(this.input.buttons.rb&&!wasRB)this.fire();
    if(this.input.buttons.l3&&!wasL3)this.barrelRoll();
    if(this.input.buttons.b&&!wasB)this.useBomb();
  },

  update(){
    if(this.gameOver||this.complete)return;

    this.pollGamepad();

    let lx=this.input.lx||(this.keys.KeyA?-1:this.keys.KeyD?1:0);
    let ly=this.input.ly||(this.keys.KeyW?-1:this.keys.KeyS?1:0);

    this.shipTargetX=T.clamp(this.shipTargetX+lx*.03,-1,1);
    this.shipTargetY=T.clamp(this.shipTargetY-ly*.03,-1,1);

    this.shipX=T.lerp(this.shipX,this.shipTargetX,.1);
    this.shipY=T.lerp(this.shipY,this.shipTargetY,.1);

    this.ship.position.x=this.shipX*50;
    this.ship.position.y=this.shipY*30;

    this.ship.rotation.z=T.lerp(this.ship.rotation.z,-lx*.5,.1);
    this.ship.rotation.x=T.lerp(this.ship.rotation.x,ly*.3,.1);

    // Barrel roll
    if(this.barrelRolling){
      this.barrelRollTimer+=.25;
      this.ship.rotation.z=this.barrelRollTimer;
      if(this.barrelRollTimer>=Math.PI*2){
        this.barrelRolling=false;
        this.ship.rotation.z=0;
      }
    }

    // World scrolling
    const scrollSpeed=2.2;
    this.distance+=scrollSpeed;

    // Move starfield
    const starPos=this.starField.geometry.attributes.position.array;
    for(let i=0;i<starPos.length;i+=3){
      starPos[i+2]+=scrollSpeed*.4;
      if(starPos[i+2]>100)starPos[i+2]=-1200;
    }
    this.starField.geometry.attributes.position.needsUpdate=true;

    // Move debris
    this.debris.forEach(d=>{
      d.position.z+=scrollSpeed;
      d.rotation.x+=d.userData.rotSpeed.x;
      d.rotation.y+=d.userData.rotSpeed.y;
      d.rotation.z+=d.userData.rotSpeed.z;
      // Sparks flicker
      d.children?.forEach(c=>{
        if(c.userData.isSpark){
          c.visible=Math.random()>.3;
        }
      });
    });

    // Move turrets
    this.turrets.forEach(t=>{
      t.position.z+=scrollSpeed;
      // Turret fires at player
      t.userData.fireTimer--;
      if(t.userData.fireTimer<=0&&t.position.z>-200&&t.position.z<20){
        t.userData.fireTimer=80+T.rnd(0,40);
        this.fireTurret(t);
      }
      // Targeting light blink
      t.children?.forEach(c=>{
        if(c.userData.isLight){
          c.material.color.setHex(Math.sin(Date.now()*.01)>.5?0xff0000:0x440000);
        }
      });
      // Look at player
      const dir=this.ship.position.clone().sub(t.position);
      const angle=Math.atan2(dir.x,dir.z);
      t.rotation.y=angle;
    });

    // Spawn new debris
    if(this.debris.length<30){
      const minZ=Math.min(...this.debris.map(d=>d.position.z));
      if(minZ>-400){
        for(let i=0;i<3;i++)this.spawnDebris(-400-T.rnd(0,80));
      }
    }

    // Spawn turrets
    if(Math.random()<.003)this.spawnTurret(-500);

    // Spawn enemies
    if(Math.random()<.012)this.spawnEnemy('drone');
    if(Math.random()<.004)this.spawnEnemy('bomber');
    if(Math.random()<.008)this.spawnEnemy('ring');

    // Update enemies
    this.enemies.forEach(e=>{
      e.mesh.position.z+=scrollSpeed;

      if(e.type==='drone'){
        e.mesh.position.x+=e.vx;
        e.mesh.position.y+=e.vy;
        e.mesh.position.z+=.4;
        e.mesh.rotation.y+=.05;
      }
      if(e.isRing){
        // Spin the ring around Z (facing player)
        e.mesh.rotation.z+=.04;
      }

      const dist=e.mesh.position.distanceTo(this.ship.position);
      if(dist<(e.isRing?12:e.type==='bomber'?10:5)){
        if(e.isRing){
          this.addScore(150);
          this.shield=Math.min(100,this.shield+30);
          document.getElementById('shield-fill').style.width=this.shield+'%';
          this.showRadio('🦊','Ring bonus! Shield restored!');
        }else{
          this.takeDamage(e.type==='bomber'?35:25);
        }
        this.sc.remove(e.mesh);
        e.dead=true;
      }

      if(e.mesh.position.z>60){
        this.sc.remove(e.mesh);
        e.dead=true;
      }
    });
    this.enemies=this.enemies.filter(e=>!e.dead);

    // Update beams (turret shots)
    this.beams.forEach(b=>{
      b.position.add(b.userData.vel);
      b.userData.life--;
      // Hit player
      if(b.position.distanceTo(this.ship.position)<5){
        this.takeDamage(15);
        b.userData.life=0;
      }
      if(b.userData.life<=0){
        this.sc.remove(b);
        b.userData.dead=true;
      }
    });
    this.beams=this.beams.filter(b=>!b.userData.dead);

    // Debris collision
    this.debris.forEach(d=>{
      const dist=d.position.distanceTo(this.ship.position);
      if(dist<d.userData.size+3){
        this.takeDamage(25);
        this.spawnExplosion(d.position);
        this.sc.remove(d);
        d.userData.dead=true;
      }
    });
    this.debris=this.debris.filter(d=>!d.userData.dead);

    // Turret collision
    this.turrets.forEach(t=>{
      const dist=t.position.distanceTo(this.ship.position);
      if(dist<8){
        this.takeDamage(30);
        this.spawnExplosion(t.position);
        this.sc.remove(t);
        t.userData.dead=true;
      }
    });
    this.turrets=this.turrets.filter(t=>!t.userData.dead);

    // Update bullets
    this.bullets.forEach(b=>{
      b.position.add(b.userData.vel);
      b.userData.life--;

      // Hit enemies
      this.enemies.forEach(e=>{
        if(!e.isRing&&b.position.distanceTo(e.mesh.position)<(e.type==='bomber'?6:3)){
          e.hp--;
          b.userData.life=0;
          if(e.hp<=0){
            this.spawnExplosion(e.mesh.position);
            this.sc.remove(e.mesh);
            e.dead=true;
            this.addScore(e.type==='drone'?25:80);
          }
        }
      });

      // Hit turrets
      this.turrets.forEach(t=>{
        if(b.position.distanceTo(t.position)<6){
          t.userData.hp--;
          b.userData.life=0;
          if(t.userData.hp<=0){
            this.spawnExplosion(t.position);
            this.sc.remove(t);
            t.userData.dead=true;
            this.addScore(40);
          }
        }
      });

      // Hit debris (smaller pieces can be destroyed)
      this.debris.forEach(d=>{
        if(d.userData.size<12&&b.position.distanceTo(d.position)<d.userData.size){
          b.userData.life=0;
          this.spawnExplosion(d.position);
          this.sc.remove(d);
          d.userData.dead=true;
          this.addScore(8);
        }
      });

      if(b.userData.life<=0){
        this.sc.remove(b);
        b.dead=true;
      }
    });
    this.bullets=this.bullets.filter(b=>!b.dead);
    this.turrets=this.turrets.filter(t=>!t.userData.dead);
    this.debris=this.debris.filter(d=>!d.userData.dead);

    // Update particles
    this.particles.forEach(p=>{
      p.position.add(p.userData.vel);
      p.userData.life--;
      p.scale.setScalar(p.userData.life/45);
      if(p.userData.life<=0){
        this.sc.remove(p);
        p.dead=true;
      }
    });
    this.particles=this.particles.filter(p=>!p.dead);

    // Cleanup far debris
    this.debris=this.debris.filter(d=>{
      if(d.position.z>100){
        this.sc.remove(d);
        return false;
      }
      return true;
    });
    this.turrets=this.turrets.filter(t=>{
      if(t.position.z>80){
        this.sc.remove(t);
        return false;
      }
      return true;
    });

    // Boost regen
    this.boost=Math.min(100,this.boost+.07);
    document.getElementById('boost-fill').style.width=this.boost+'%';

    if(this.invincible>0)this.invincible--;

    // Engine glow
    this.ship.children.forEach(c=>{
      if(c.userData.isGlow){
        c.scale.z=.8+Math.random()*.4;
      }
    });

    // Level complete
    if(this.distance>this.levelLength){
      this.complete=true;
      document.getElementById('mission-complete').style.display='block';
      document.getElementById('final-score').textContent=this.score;
      this.showRadio('🦊','We escaped Sector X! Mission complete!');
    }

    // Radio messages
    if(this.distance>500&&!this.msg1){
      this.msg1=true;
      this.showRadio('🐰','What happened to this station?!');
    }
    if(this.distance>1200&&!this.msg2){
      this.msg2=true;
      this.showRadio('🦅','Automated defenses still online! Watch the turrets!');
    }
    if(this.distance>2200&&!this.msg3){
      this.msg3=true;
      this.showRadio('🐸','I\'m detecting strange energy readings ahead...');
    }
    if(this.distance>3500&&!this.msg4){
      this.msg4=true;
      this.showRadio('🦊','Almost through! Push forward!');
    }
  },

  fireTurret(turret){
    const beam=new THREE.Mesh(
      new THREE.SphereGeometry(.4),
      new THREE.MeshBasicMaterial({color:0xff2200})
    );
    beam.position.copy(turret.position);
    const dir=this.ship.position.clone().sub(turret.position).normalize();
    beam.userData={
      vel:dir.multiplyScalar(1.5),
      life:100
    };
    this.sc.add(beam);
    this.beams.push(beam);
  },

  animate(){
    requestAnimationFrame(()=>this.animate());

    this.update();

    this.ca.position.x=T.lerp(this.ca.position.x,this.ship.position.x*.3,.05);
    this.ca.position.y=T.lerp(this.ca.position.y,10+this.ship.position.y*.2,.05);

    if(this.invincible>0){
      this.ship.visible=Math.floor(this.invincible/3)%2===0;
    }else{
      this.ship.visible=true;
    }

    if((this.input.buttons.rb||this.keys.Space)&&Math.random()<.2){
      this.fire();
    }

    this.rn.render(this.sc,this.ca);
  }
};

onload=()=>G.init();
onresize=()=>{G.rn.setSize(innerWidth,innerHeight);G.ca.aspect=innerWidth/innerHeight;G.ca.updateProjectionMatrix()};
</script></body></html>
