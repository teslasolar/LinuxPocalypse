<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌀 KONOMI v7 - Pure Procedural FDM</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#080810;--p:#0c0c14;--b:#1a1a28;--g:#ffd700;--c:#0ff;--gr:#0f8;--f:#f63;--d:#445}
body{background:var(--bg);color:#aab;font-family:'JetBrains Mono',monospace;height:100vh;overflow:hidden}
.app{display:grid;grid-template-columns:240px 1fr;height:100vh}
.pnl{background:var(--p);padding:10px;overflow-y:auto;border-right:1px solid var(--b);font-size:9px}
.pt{color:var(--c);text-transform:uppercase;letter-spacing:1px;margin:10px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--b);font-size:8px}
.pt:first-child{margin-top:0}
.vp{position:relative;background:#030305}
#cc{width:100%;height:100%}
.ov{position:absolute;top:8px;left:8px;font-size:8px;color:var(--d);pointer-events:none;line-height:1.4}
.ovr{position:absolute;top:8px;right:8px;font-size:8px;color:var(--d);text-align:right}
.row{display:flex;justify-content:space-between;margin-bottom:3px}
.lbl{color:var(--d)}.val{color:var(--c);font-weight:700}
input[type=range]{width:100%;height:3px;background:var(--b);-webkit-appearance:none;margin:3px 0 6px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;background:var(--g);border-radius:50%;cursor:pointer}
button{width:100%;padding:7px;background:linear-gradient(135deg,var(--g),#a80);border:none;border-radius:3px;color:#000;font-family:inherit;font-weight:700;font-size:9px;cursor:pointer;margin-bottom:4px}
button:hover{filter:brightness(1.1)}
button.s{background:var(--b);color:var(--c)}
button.e{background:linear-gradient(135deg,var(--gr),#0a5)}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.sb{background:rgba(0,0,0,.3);padding:5px;border-radius:3px;text-align:center}
.sv{font-size:11px;font-weight:700;color:var(--g)}
.sl{font-size:7px;color:var(--d)}
.status{padding:6px;border-radius:3px;margin:6px 0;font-size:8px;background:rgba(0,255,136,.1);border:1px solid var(--gr);color:var(--gr)}
.log{background:#000;border-radius:3px;padding:4px;font-size:7px;max-height:90px;overflow-y:auto}
.lg{margin-bottom:1px;opacity:.8}
.lg.g{color:var(--gr)}.lg.p{color:var(--g)}.lg.c{color:var(--c)}.lg.f{color:var(--f)}
.ent{background:#000;padding:4px;border-radius:2px;font-size:7px;color:var(--g);word-break:break-all;margin-bottom:6px}
</style>
</head>
<body>
<div class="app">
<div class="pnl">

<div class="pt">🎲 Entropy Seed</div>
<div class="ent" id="ent">...</div>

<div class="pt">⚙️ FDM Settings</div>
<div class="row"><span class="lbl">Layers</span><span class="val" id="vL">50</span></div>
<input type="range" id="sL" min="20" max="120" value="50">
<div class="row"><span class="lbl">Layer H</span><span class="val" id="vH">.2mm</span></div>
<input type="range" id="sH" min=".1" max=".4" step=".05" value=".2">
<div class="row"><span class="lbl">Max Overhang</span><span class="val" id="vO">45°</span></div>
<input type="range" id="sO" min="25" max="60" step="5" value="45">
<div class="row"><span class="lbl">Growth Rate</span><span class="val" id="vG">1.0</span></div>
<input type="range" id="sG" min=".5" max="2" step=".1" value="1">

<div class="pt">▶ Generate</div>
<button onclick="gen()">🎲 NEW RANDOM</button>
<button class="s" onclick="regen()">↻ SAME SEED</button>

<div class="pt">🔧 Status</div>
<div class="status" id="status">Ready</div>

<div class="pt">📊 Stats</div>
<div class="sg">
<div class="sb"><div class="sv" id="stV">0</div><div class="sl">Verts</div></div>
<div class="sb"><div class="sv" id="stT">0</div><div class="sl">Tris</div></div>
<div class="sb"><div class="sv" id="stP">0</div><div class="sl">Points</div></div>
<div class="sb"><div class="sv" id="stC">0</div><div class="sl">Constrained</div></div>
</div>

<div class="pt">💾 Export</div>
<button class="e" id="bE" onclick="exp()" disabled>📥 STL</button>

<div class="pt">📜 Log</div>
<div class="log" id="log"></div>
</div>

<div class="vp">
<div id="cc"></div>
<div class="ov" id="ovl">Initializing...</div>
<div class="ovr">Pure Procedural<br>No Presets</div>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
//═══════════════════════════════════════════════════════════════════
// 🌀 KONOMI v7 - PURE PROCEDURAL FDM
// NO PRESETS - Grows from seed point layer by layer
//═══════════════════════════════════════════════════════════════════

const φ=1.618033988749895;

//─── ENTROPY: Collect from environment ───
function collectEntropy(){
  const n=Date.now(),p=performance.now();
  return{
    t:n,ms:n%1000,perf:p,
    rnd:Math.random(),
    scr:screen.width^screen.height,
    win:innerWidth^innerHeight,
    ua:navigator.userAgent.length,
    mem:navigator.deviceMemory||4,
    cpu:navigator.hardwareConcurrency||4,
    tz:new Date().getTimezoneOffset(),
    lang:navigator.language.charCodeAt(0)||65
  };
}

function hashEntropy(e){
  let h=φ;
  for(const k in e)h=(h*φ+e[k])%1e9;
  return(h/1e9)*φ+.1;
}

//─── RNG: φ-based from seed ───
let S=φ;
function rng(){S=(S*φ*9999)%1;return S||.5}
function rngR(a,b){return a+rng()*(b-a)}
function rngI(a,b){return Math.floor(rngR(a,b+1))}
function rngA(){return rng()*Math.PI*2}
function rngS(){return rng()>.5?1:-1}

//═══════════════════════════════════════════════════════════════════
// PURE PROCEDURAL GENERATOR
// No modes, no presets - each point decides its own fate
//═══════════════════════════════════════════════════════════════════

function generate(numL,lH,maxOH,growthRate){
  const layers=[];
  const maxStep=Math.tan(maxOH*Math.PI/180)*lH; // Max XZ per layer
  let totalPts=0,constrained=0;

  // Layer 0: Start with seed cluster (random small shape)
  const L0=[];
  const seedPts=rngI(3,8);
  const seedR=rngR(2,6);
  for(let i=0;i<seedPts;i++){
    const a=i/seedPts*Math.PI*2+rngR(-.2,.2);
    const r=seedR*rngR(.7,1.3);
    L0.push({x:Math.cos(a)*r,z:Math.sin(a)*r});
  }
  layers.push({y:0,pts:L0});
  totalPts+=L0.length;
  log(`L0: ${L0.length} seed points`,'c');

  // Build each layer from previous
  for(let L=1;L<numL;L++){
    const y=L*lH;
    const t=L/numL; // Progress 0→1
    const prev=layers[L-1].pts;
    const curr=[];

    // For each point in previous layer, decide what happens
    for(let i=0;i<prev.length;i++){
      const p=prev[i];

      // === GROWTH DECISION (pure procedural) ===
      // Each point independently decides to: continue, branch, or stop
      const fate=rng();

      if(fate<.05*t){
        // DIE: Point stops (more likely at top)
        continue;
      }

      if(fate>.85-t*.2){
        // BRANCH: Create 2 children
        const spread=rngR(1,3)*growthRate;
        const baseA=rngA();

        for(let b=0;b<2;b++){
          const ba=baseA+(b===0?rngR(.3,.8):-rngR(.3,.8));
          let nx=p.x+Math.cos(ba)*spread;
          let nz=p.z+Math.sin(ba)*spread;

          // CONSTRAIN to max overhang
          const d=Math.sqrt((nx-p.x)**2+(nz-p.z)**2);
          if(d>maxStep){
            constrained++;
            const scale=maxStep*.95/d;
            nx=p.x+(nx-p.x)*scale;
            nz=p.z+(nz-p.z)*scale;
          }
          curr.push({x:nx,z:nz,parent:i});
        }
      }else{
        // CONTINUE: Single child with drift
        const drift=rngR(0,2)*growthRate;
        const da=rngA();
        let nx=p.x+Math.cos(da)*drift;
        let nz=p.z+Math.sin(da)*drift;

        // CONSTRAIN
        const d=Math.sqrt((nx-p.x)**2+(nz-p.z)**2);
        if(d>maxStep){
          constrained++;
          const scale=maxStep*.95/d;
          nx=p.x+(nx-p.x)*scale;
          nz=p.z+(nz-p.z)*scale;
        }
        curr.push({x:nx,z:nz,parent:i});
      }
    }

    // Random NEW points can spawn (connected to random existing)
    if(rng()<.3&&curr.length>0){
      const parent=curr[rngI(0,curr.length-1)];
      const na=rngA();
      const nd=rngR(.5,maxStep*.9);
      curr.push({
        x:parent.x+Math.cos(na)*nd,
        z:parent.z+Math.sin(na)*nd,
        spawned:true
      });
    }

    // Ensure minimum points per layer
    if(curr.length<3&&prev.length>0){
      // Force some continuation
      for(let i=0;i<3&&i<prev.length;i++){
        const p=prev[i];
        const da=rngA();
        const dd=rngR(0,maxStep*.5);
        curr.push({x:p.x+Math.cos(da)*dd,z:p.z+Math.sin(da)*dd});
      }
    }

    if(curr.length===0)break; // Structure collapsed

    layers.push({y,pts:curr});
    totalPts+=curr.length;

    if(L%10===0)log(`L${L}: ${curr.length} pts`,'c');
  }

  log(`Done: ${layers.length}L, ${totalPts}pts, ${constrained} constrained`,'g');
  return{layers,totalPts,constrained};
}

//═══════════════════════════════════════════════════════════════════
// MESH: Build tube geometry along paths
//═══════════════════════════════════════════════════════════════════

function buildMesh(layers,nW,lH){
  const v=[],idx=[];
  let vc=0;
  const seg=5; // Tube segments

  for(const L of layers){
    const y=L.y,pts=L.pts;
    if(pts.length<2)continue;

    for(let i=0;i<pts.length;i++){
      const p=pts[i];
      const pp=pts[Math.max(0,i-1)];
      const pn=pts[Math.min(pts.length-1,i+1)];

      // Direction
      let dx=pn.x-pp.x,dz=pn.z-pp.z;
      const ln=Math.sqrt(dx*dx+dz*dz)||1;
      dx/=ln;dz/=ln;

      // Perpendicular
      const px=-dz,pz=dx;
      const hw=nW/2;

      // Create profile ring
      for(let j=0;j<seg;j++){
        const t=j/(seg-1);
        let ox,oy;
        // Flat bottom profile
        if(t<.2){ox=-hw;oy=0}
        else if(t<.4){ox=-hw;oy=t/.4*lH}
        else if(t<.6){ox=0;oy=lH*1.1}
        else if(t<.8){ox=hw;oy=(1-(t-.6)/.2)*lH}
        else{ox=hw;oy=0}

        v.push(p.x+px*ox,y+oy,p.z+pz*ox);
      }

      // Connect to previous
      if(i>0){
        const c=vc,pr=vc-seg;
        for(let j=0;j<seg-1;j++){
          idx.push(pr+j,c+j,pr+j+1);
          idx.push(pr+j+1,c+j,c+j+1);
        }
      }
      vc+=seg;
    }
  }

  return{v,idx};
}

//═══════════════════════════════════════════════════════════════════
// THREE.JS
//═══════════════════════════════════════════════════════════════════
let scene,cam,ren,mesh;

function initGL(){
  const c=document.getElementById('cc');
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x030305);

  cam=new THREE.PerspectiveCamera(45,c.clientWidth/c.clientHeight,.1,500);
  cam.position.set(40,30,40);
  cam.lookAt(0,5,0);

  ren=new THREE.WebGLRenderer({antialias:true});
  ren.setSize(c.clientWidth,c.clientHeight);
  ren.setPixelRatio(Math.min(devicePixelRatio,2));
  c.appendChild(ren.domElement);

  scene.add(new THREE.AmbientLight(0x404050,.5));
  const sun=new THREE.DirectionalLight(0xffffff,.8);
  sun.position.set(20,40,20);
  scene.add(sun);

  // Plate
  const plate=new THREE.Mesh(
    new THREE.BoxGeometry(50,1,50),
    new THREE.MeshStandardMaterial({color:0x12121a})
  );
  plate.position.y=-.5;
  scene.add(plate);
  scene.add(new THREE.GridHelper(50,10,0x333,0x222));

  // Controls
  let drag=false,px=0,py=0,sp={t:Math.PI/4,p:Math.PI/3,r:60};
  const el=ren.domElement;
  el.onmousedown=e=>{drag=true;px=e.clientX;py=e.clientY};
  el.onmouseup=el.onmouseleave=()=>drag=false;
  el.onmousemove=e=>{
    if(!drag)return;
    sp.t-=(e.clientX-px)*.01;
    sp.p=Math.max(.2,Math.min(2.9,sp.p+(e.clientY-py)*.01));
    px=e.clientX;py=e.clientY;
    upCam();
  };
  el.onwheel=e=>{sp.r=Math.max(15,Math.min(120,sp.r+e.deltaY*.05));upCam();e.preventDefault()};

  function upCam(){
    cam.position.set(
      sp.r*Math.sin(sp.p)*Math.cos(sp.t),
      sp.r*Math.cos(sp.p),
      sp.r*Math.sin(sp.p)*Math.sin(sp.t)
    );
    cam.lookAt(0,5,0);
  }
  upCam();

  window.onresize=()=>{
    cam.aspect=c.clientWidth/c.clientHeight;
    cam.updateProjectionMatrix();
    ren.setSize(c.clientWidth,c.clientHeight);
  };

  (function anim(){requestAnimationFrame(anim);ren.render(scene,cam)})();
}

function setMesh(verts,indices){
  if(mesh){scene.remove(mesh);mesh.geometry.dispose();mesh.material.dispose()}

  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));
  g.setIndex(indices);
  g.computeVertexNormals();

  mesh=new THREE.Mesh(g,new THREE.MeshStandardMaterial({
    color:0xff6b35,
    metalness:.1,
    roughness:.5,
    side:THREE.DoubleSide
  }));
  scene.add(mesh);
}

//═══════════════════════════════════════════════════════════════════
// UI & MAIN
//═══════════════════════════════════════════════════════════════════
let seed=null;

function log(m,t='g'){
  const l=document.getElementById('log');
  const d=document.createElement('div');
  d.className='lg '+t;
  d.textContent=m;
  l.appendChild(d);
  l.scrollTop=l.scrollHeight;
}

function gen(){
  // Fresh entropy
  const e=collectEntropy();
  seed=hashEntropy(e);
  document.getElementById('ent').textContent=
    `t:${e.t%1e6} p:${e.perf.toFixed(0)} r:${e.rnd.toFixed(4)} → ${seed.toFixed(6)}`;
  log(`Seed: ${seed.toFixed(8)}`,'p');
  run();
}

function regen(){
  if(!seed)return gen();
  log(`Reusing seed: ${seed.toFixed(6)}`,'p');
  run();
}

function run(){
  const numL=parseInt(document.getElementById('sL').value);
  const lH=parseFloat(document.getElementById('sH').value);
  const maxOH=parseInt(document.getElementById('sO').value);
  const growthRate=parseFloat(document.getElementById('sG').value);

  S=seed; // Reset RNG

  document.getElementById('status').textContent='Generating...';
  document.getElementById('status').style.background='rgba(0,255,255,.1)';
  document.getElementById('status').style.borderColor='var(--c)';
  document.getElementById('status').style.color='var(--c)';

  setTimeout(()=>{
    // Generate structure
    const{layers,totalPts,constrained}=generate(numL,lH,maxOH,growthRate);

    // Build mesh
    const{v,idx}=buildMesh(layers,.4,lH);
    setMesh(v,idx);

    // Update UI
    const verts=(v.length/3);
    const tris=(idx.length/3);
    const height=(layers.length*lH).toFixed(1);

    document.getElementById('stV').textContent=verts.toLocaleString();
    document.getElementById('stT').textContent=tris.toLocaleString();
    document.getElementById('stP').textContent=totalPts;
    document.getElementById('stC').textContent=constrained;

    document.getElementById('ovl').innerHTML=
      `Verts: ${verts} | Tris: ${tris}<br>`+
      `Layers: ${layers.length} | Height: ${height}mm<br>`+
      `Points: ${totalPts} | Constrained: ${constrained}`;

    document.getElementById('status').textContent=
      `✓ Printable! ${layers.length} layers, ${constrained} constrained`;
    document.getElementById('status').style.background='rgba(0,255,136,.1)';
    document.getElementById('status').style.borderColor='var(--gr)';
    document.getElementById('status').style.color='var(--gr)';

    document.getElementById('bE').disabled=false;
    log('✓ Complete!','g');
  },20);
}

function exp(){
  if(!mesh)return;
  log('Exporting...','c');

  const g=mesh.geometry,pos=g.getAttribute('position'),idx=g.getIndex();
  const tc=idx?idx.count/3:pos.count/9;
  const buf=new ArrayBuffer(84+tc*50),dv=new DataView(buf);

  for(let i=0;i<80;i++)dv.setUint8(i,i<10?'KONOMI v7'.charCodeAt(i):0);
  dv.setUint32(80,tc,true);

  let o=84;
  for(let i=0;i<tc;i++){
    const i0=idx.getX(i*3),i1=idx.getX(i*3+1),i2=idx.getX(i*3+2);
    const v0=[pos.getX(i0),pos.getY(i0),pos.getZ(i0)];
    const v1=[pos.getX(i1),pos.getY(i1),pos.getZ(i1)];
    const v2=[pos.getX(i2),pos.getY(i2),pos.getZ(i2)];

    const ax=v1[0]-v0[0],ay=v1[1]-v0[1],az=v1[2]-v0[2];
    const bx=v2[0]-v0[0],by=v2[1]-v0[1],bz=v2[2]-v0[2];
    let nx=ay*bz-az*by,ny=az*bx-ax*bz,nz=ax*by-ay*bx;
    const nl=Math.sqrt(nx*nx+ny*ny+nz*nz)||1;

    dv.setFloat32(o,nx/nl,true);o+=4;
    dv.setFloat32(o,ny/nl,true);o+=4;
    dv.setFloat32(o,nz/nl,true);o+=4;
    for(const vx of[v0,v1,v2]){
      dv.setFloat32(o,vx[0],true);o+=4;
      dv.setFloat32(o,vx[1],true);o+=4;
      dv.setFloat32(o,vx[2],true);o+=4;
    }
    dv.setUint16(o,0,true);o+=2;
  }

  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([buf],{type:'application/octet-stream'}));
  a.download=`konomi7-${Date.now()}.stl`;
  a.click();
  log(`Exported ${tc} tris`,'p');
}

// Init
window.onload=()=>{
  document.getElementById('sL').oninput=function(){document.getElementById('vL').textContent=this.value};
  document.getElementById('sH').oninput=function(){document.getElementById('vH').textContent=this.value+'mm'};
  document.getElementById('sO').oninput=function(){document.getElementById('vO').textContent=this.value+'°'};
  document.getElementById('sG').oninput=function(){document.getElementById('vG').textContent=this.value};

  initGL();
  gen(); // Auto-gen on load
};
</script>
</body>
</html>
