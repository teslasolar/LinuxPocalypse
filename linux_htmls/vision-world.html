<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vision World - CV Agent Perception</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a12;overflow:hidden;font:11px monospace;color:#0ff}
#world{position:fixed;top:0;left:0;cursor:crosshair}
#overlay{position:fixed;top:0;left:0;pointer-events:none}
.p{position:absolute;background:rgba(0,20,40,.9);border:1px solid #0ff;border-radius:6px;padding:8px;z-index:100}
button{background:linear-gradient(135deg,#08f,#06a);color:#fff;border:1px solid #0af;padding:5px 10px;margin:2px;border-radius:4px;cursor:pointer;font-size:10px}
button:hover{background:#0af}button.active{background:#0f0;color:#000}
.row{display:flex;gap:5px;margin:3px 0;flex-wrap:wrap}
.stat{background:#001020;border:1px solid #068;border-radius:4px;padding:4px 8px;text-align:center;min-width:55px}
.val{font-size:13px;font-weight:bold}
.lbl{font-size:8px;opacity:.7}
select{background:#001020;color:#0ff;border:1px solid #0af;padding:4px;border-radius:4px;font-size:10px}
.vision-preview{width:60px;height:40px;border:1px solid #0f0;margin:2px;image-rendering:pixelated}
#agent-views{display:flex;flex-wrap:wrap;gap:4px;max-width:200px}
</style></head><body>
<canvas id="world"></canvas>
<canvas id="overlay"></canvas>

<div class="p" style="top:8px;left:8px;width:180px">
<div style="color:#0ff;text-align:center;font-size:13px;margin-bottom:8px">👁️ VISION WORLD</div>
<div class="row">
<div class="stat"><div class="val" id="agents">0</div><div class="lbl">Agents</div></div>
<div class="stat"><div class="val" id="objects">0</div><div class="lbl">Objects</div></div>
<div class="stat"><div class="val" id="fps">0</div><div class="lbl">FPS</div></div>
</div>
<div class="row">
<div class="stat" style="border-color:#f80"><div class="val" id="detections">0</div><div class="lbl">Detects</div></div>
<div class="stat" style="border-color:#f0f"><div class="val" id="actions">0</div><div class="lbl">Actions</div></div>
</div>
</div>

<div class="p" style="top:8px;right:8px;width:200px">
<div style="color:#f80;text-align:center;font-size:11px;margin-bottom:5px">🎨 DRAW / INTERACT</div>
<div class="row">
<button id="btn-draw" class="active" onclick="S.setTool('draw')">✏️Draw</button>
<button id="btn-erase" onclick="S.setTool('erase')">🧹Erase</button>
<button id="btn-food" onclick="S.setTool('food')">🟢Food</button>
</div>
<div class="row">
<button id="btn-danger" onclick="S.setTool('danger')">🔴Danger</button>
<button id="btn-wall" onclick="S.setTool('wall')">⬛Wall</button>
<button id="btn-beacon" onclick="S.setTool('beacon')">💡Beacon</button>
</div>
<div class="row">
<select id="brush-size" onchange="S.brushSize=+this.value">
<option value="5">Small</option>
<option value="15" selected>Medium</option>
<option value="30">Large</option>
<option value="60">Huge</option>
</select>
<button onclick="S.clear()">🗑️Clear</button>
</div>
</div>

<div class="p" style="top:180px;right:8px;width:200px">
<div style="color:#0f0;text-align:center;font-size:11px;margin-bottom:5px">🤖 AGENTS</div>
<div class="row">
<button onclick="S.addAgent('seeker')">+Seeker</button>
<button onclick="S.addAgent('avoider')">+Avoider</button>
</div>
<div class="row">
<button onclick="S.addAgent('follower')">+Follower</button>
<button onclick="S.addAgent('explorer')">+Explorer</button>
</div>
<div class="row">
<button onclick="S.showVision=!S.showVision">👁️Toggle FOV</button>
</div>
<div style="margin-top:5px;font-size:9px;color:#888" id="agent-info">Agents see via pixel sampling</div>
</div>

<div class="p" style="bottom:8px;left:8px;width:220px">
<div style="color:#f0f;text-align:center;font-size:11px;margin-bottom:5px">📷 AGENT VIEWS</div>
<div id="agent-views"></div>
<div style="font-size:8px;color:#666;margin-top:4px">What each agent "sees"</div>
</div>

<div class="p" style="bottom:8px;right:8px;width:180px">
<div style="color:#ff0;text-align:center;font-size:11px;margin-bottom:5px">🎯 DETECTION LOG</div>
<div id="log" style="height:80px;overflow-y:auto;font-size:9px;color:#888"></div>
</div>

<script>
const T={rnd:(a,b)=>a+Math.random()*(b-a),clamp:(v,a,b)=>Math.max(a,Math.min(b,v)),dist:(a,b)=>Math.sqrt((a.x-b.x)**2+(a.y-b.y)**2)};

const COLORS={
  food:'#00ff00',
  danger:'#ff0000',
  wall:'#444444',
  beacon:'#ffff00',
  draw:'#0088ff'
};

const S={
  agents:[],objects:[],
  tool:'draw',brushSize:15,
  showVision:true,
  detections:0,actions:0,
  isDrawing:false,lastX:0,lastY:0,
  frameCount:0,lastFPS:0,fpsTime:0,

  init(){
    this.world=document.getElementById('world');
    this.overlay=document.getElementById('overlay');
    this.ctx=this.world.getContext('2d');
    this.octx=this.overlay.getContext('2d');
    this.resize();

    // Mouse events
    this.world.onmousedown=e=>{this.isDrawing=true;this.lastX=e.clientX;this.lastY=e.clientY;this.paint(e)};
    this.world.onmousemove=e=>{if(this.isDrawing)this.paint(e)};
    this.world.onmouseup=()=>this.isDrawing=false;
    this.world.onmouseleave=()=>this.isDrawing=false;

    // Initial agents
    for(let i=0;i<3;i++)this.addAgent('seeker');
    for(let i=0;i<2;i++)this.addAgent('avoider');

    // Draw some initial objects
    this.ctx.fillStyle=COLORS.food;
    for(let i=0;i<5;i++){
      const x=T.rnd(100,this.w-100),y=T.rnd(100,this.h-100);
      this.ctx.beginPath();
      this.ctx.arc(x,y,20,0,Math.PI*2);
      this.ctx.fill();
    }

    this.animate();
    setInterval(()=>this.tick(),33);
  },

  resize(){
    this.w=innerWidth;this.h=innerHeight;
    this.world.width=this.overlay.width=this.w;
    this.world.height=this.overlay.height=this.h;
    this.ctx.fillStyle='#0a0a12';
    this.ctx.fillRect(0,0,this.w,this.h);
  },

  setTool(t){
    this.tool=t;
    document.querySelectorAll('.p button').forEach(b=>b.classList.remove('active'));
    document.getElementById('btn-'+t)?.classList.add('active');
  },

  paint(e){
    const x=e.clientX,y=e.clientY;

    if(this.tool==='erase'){
      this.ctx.fillStyle='#0a0a12';
      this.ctx.beginPath();
      this.ctx.arc(x,y,this.brushSize,0,Math.PI*2);
      this.ctx.fill();
    }else{
      this.ctx.strokeStyle=COLORS[this.tool]||COLORS.draw;
      this.ctx.lineWidth=this.brushSize;
      this.ctx.lineCap='round';
      this.ctx.beginPath();
      this.ctx.moveTo(this.lastX,this.lastY);
      this.ctx.lineTo(x,y);
      this.ctx.stroke();
    }
    this.lastX=x;this.lastY=y;
  },

  clear(){
    this.ctx.fillStyle='#0a0a12';
    this.ctx.fillRect(0,0,this.w,this.h);
  },

  addAgent(type){
    const colors={seeker:'#00ffff',avoider:'#ff00ff',follower:'#ffaa00',explorer:'#00ff88'};
    const agent={
      x:T.rnd(100,this.w-100),
      y:T.rnd(100,this.h-100),
      dir:Math.random()*Math.PI*2,
      speed:1.5+Math.random(),
      type,
      color:colors[type],
      fov:Math.PI/2.5,// Field of view
      viewDist:120,
      viewRes:16,// Pixels sampled across FOV
      vision:[],// What it sees
      target:null,
      lastAction:'idle',
      canvas:document.createElement('canvas')
    };
    agent.canvas.width=agent.viewRes;
    agent.canvas.height=8;
    agent.canvas.className='vision-preview';
    agent.canvas.style.borderColor=agent.color;
    document.getElementById('agent-views').appendChild(agent.canvas);
    this.agents.push(agent);
    this.updateUI();
  },

  // Sample pixels in agent's field of view
  sampleVision(agent){
    const samples=[];
    const imgData=this.ctx.getImageData(0,0,this.w,this.h).data;

    for(let i=0;i<agent.viewRes;i++){
      const angle=agent.dir-agent.fov/2+agent.fov*(i/(agent.viewRes-1));
      const rayLen=agent.viewDist;

      // Sample along each ray
      let closest={dist:rayLen,color:null,type:null};
      for(let d=10;d<rayLen;d+=5){
        const sx=Math.round(agent.x+Math.cos(angle)*d);
        const sy=Math.round(agent.y+Math.sin(angle)*d);

        if(sx<0||sx>=this.w||sy<0||sy>=this.h)break;

        const idx=(sy*this.w+sx)*4;
        const r=imgData[idx],g=imgData[idx+1],b=imgData[idx+2];

        // Detect color types
        let type=null;
        if(g>200&&r<100&&b<100)type='food';
        else if(r>200&&g<100)type='danger';
        else if(r>200&&g>200&&b<100)type='beacon';
        else if(r>50&&r<100&&g>50&&g<100&&b>50&&b<100)type='wall';
        else if(b>150&&r<100)type='draw';

        if(type&&d<closest.dist){
          closest={dist:d,color:{r,g,b},type,angle,x:sx,y:sy};
        }
      }
      samples.push(closest);
    }
    agent.vision=samples;

    // Draw to agent's preview canvas
    const vctx=agent.canvas.getContext('2d');
    vctx.fillStyle='#000';
    vctx.fillRect(0,0,agent.viewRes,8);
    samples.forEach((s,i)=>{
      if(s.color){
        vctx.fillStyle=`rgb(${s.color.r},${s.color.g},${s.color.b})`;
        const h=8*(1-s.dist/agent.viewDist);
        vctx.fillRect(i,8-h,1,h);
      }
    });

    return samples;
  },

  // Agent decision making based on vision
  decide(agent){
    const v=agent.vision;
    let action='wander';
    let targetAngle=null;

    // Count what we see
    const seen={food:0,danger:0,wall:0,beacon:0,draw:0};
    let nearestFood=null,nearestDanger=null,nearestBeacon=null;

    v.forEach(s=>{
      if(s.type){
        seen[s.type]++;
        if(s.type==='food'&&(!nearestFood||s.dist<nearestFood.dist))nearestFood=s;
        if(s.type==='danger'&&(!nearestDanger||s.dist<nearestDanger.dist))nearestDanger=s;
        if(s.type==='beacon'&&(!nearestBeacon||s.dist<nearestBeacon.dist))nearestBeacon=s;
      }
    });

    // Type-specific behavior
    if(agent.type==='seeker'){
      // Seek food and beacons
      if(nearestFood){
        targetAngle=nearestFood.angle;
        action='seek food';
        this.detections++;
      }else if(nearestBeacon){
        targetAngle=nearestBeacon.angle;
        action='seek beacon';
      }
      // Avoid danger
      if(nearestDanger&&nearestDanger.dist<50){
        targetAngle=nearestDanger.angle+Math.PI;
        action='flee danger';
      }
    }
    else if(agent.type==='avoider'){
      // Avoid everything colored
      if(nearestDanger){
        targetAngle=nearestDanger.angle+Math.PI;
        action='avoid danger';
        this.detections++;
      }else if(nearestFood&&nearestFood.dist<60){
        targetAngle=nearestFood.angle+Math.PI;
        action='avoid food';
      }
      if(seen.wall>3){
        action='avoid walls';
        targetAngle=agent.dir+Math.PI/2;
      }
    }
    else if(agent.type==='follower'){
      // Follow any drawn lines
      const drawSamples=v.filter(s=>s.type==='draw');
      if(drawSamples.length>0){
        const avg=drawSamples.reduce((a,s)=>a+s.angle,0)/drawSamples.length;
        targetAngle=avg;
        action='follow line';
        this.detections++;
      }else if(nearestBeacon){
        targetAngle=nearestBeacon.angle;
        action='seek beacon';
      }
    }
    else if(agent.type==='explorer'){
      // Avoid areas we can see, seek darkness
      const empty=v.filter(s=>!s.type).length;
      if(empty<agent.viewRes/2){
        // Too much stuff, turn away
        targetAngle=agent.dir+T.rnd(-.5,.5)+Math.PI/2;
        action='explore new';
      }
      if(nearestDanger&&nearestDanger.dist<40){
        targetAngle=nearestDanger.angle+Math.PI;
        action='flee danger';
      }
    }

    // Apply decision
    if(targetAngle!==null){
      let diff=targetAngle-agent.dir;
      while(diff>Math.PI)diff-=Math.PI*2;
      while(diff<-Math.PI)diff+=Math.PI*2;
      agent.dir+=T.clamp(diff,-.15,.15);
      this.actions++;
    }else{
      agent.dir+=T.rnd(-.1,.1);
    }

    agent.lastAction=action;
    return action;
  },

  tick(){
    for(let agent of this.agents){
      // Sample vision
      this.sampleVision(agent);

      // Make decision
      this.decide(agent);

      // Move
      agent.x+=Math.cos(agent.dir)*agent.speed;
      agent.y+=Math.sin(agent.dir)*agent.speed;

      // Bounds
      if(agent.x<20){agent.x=20;agent.dir=Math.PI-agent.dir}
      if(agent.x>this.w-20){agent.x=this.w-20;agent.dir=Math.PI-agent.dir}
      if(agent.y<20){agent.y=20;agent.dir=-agent.dir}
      if(agent.y>this.h-20){agent.y=this.h-20;agent.dir=-agent.dir}
    }

    this.updateUI();
  },

  log(msg){
    const l=document.getElementById('log');
    const t=new Date().toLocaleTimeString().split(' ')[0];
    l.innerHTML=`<div><span style="color:#666">${t}</span> ${msg}</div>`+l.innerHTML;
    while(l.children.length>20)l.removeChild(l.lastChild);
  },

  updateUI(){
    document.getElementById('agents').textContent=this.agents.length;
    document.getElementById('detections').textContent=this.detections;
    document.getElementById('actions').textContent=this.actions;
    document.getElementById('fps').textContent=this.lastFPS;

    // Agent info
    if(this.agents.length>0){
      const a=this.agents[0];
      document.getElementById('agent-info').textContent=`${a.type}: ${a.lastAction}`;
    }
  },

  animate(){
    requestAnimationFrame(()=>this.animate());
    this.frameCount++;

    const now=performance.now();
    if(now-this.fpsTime>1000){
      this.lastFPS=this.frameCount;
      this.frameCount=0;
      this.fpsTime=now;
    }

    // Clear overlay
    this.octx.clearRect(0,0,this.w,this.h);

    // Draw agents
    for(let agent of this.agents){
      // Vision cone
      if(this.showVision){
        this.octx.beginPath();
        this.octx.moveTo(agent.x,agent.y);
        this.octx.arc(agent.x,agent.y,agent.viewDist,agent.dir-agent.fov/2,agent.dir+agent.fov/2);
        this.octx.closePath();
        this.octx.fillStyle=agent.color+'15';
        this.octx.fill();
        this.octx.strokeStyle=agent.color+'40';
        this.octx.stroke();

        // Draw what it sees
        agent.vision.forEach(s=>{
          if(s.type){
            this.octx.beginPath();
            this.octx.arc(s.x,s.y,3,0,Math.PI*2);
            this.octx.fillStyle=agent.color;
            this.octx.fill();
          }
        });
      }

      // Agent body
      this.octx.save();
      this.octx.translate(agent.x,agent.y);
      this.octx.rotate(agent.dir);

      // Triangle body
      this.octx.beginPath();
      this.octx.moveTo(12,0);
      this.octx.lineTo(-8,-7);
      this.octx.lineTo(-8,7);
      this.octx.closePath();
      this.octx.fillStyle=agent.color;
      this.octx.fill();
      this.octx.strokeStyle='#fff';
      this.octx.lineWidth=1;
      this.octx.stroke();

      // Eye
      this.octx.beginPath();
      this.octx.arc(4,0,3,0,Math.PI*2);
      this.octx.fillStyle='#000';
      this.octx.fill();
      this.octx.beginPath();
      this.octx.arc(5,0,1.5,0,Math.PI*2);
      this.octx.fillStyle='#fff';
      this.octx.fill();

      this.octx.restore();

      // Action label
      this.octx.fillStyle=agent.color;
      this.octx.font='9px monospace';
      this.octx.fillText(agent.lastAction,agent.x-20,agent.y-15);
    }

    // Instructions
    this.octx.fillStyle='#ffffff40';
    this.octx.font='10px monospace';
    this.octx.fillText('Draw on screen - agents react to what they SEE',10,this.h-10);
  }
};

onload=()=>S.init();
onresize=()=>S.resize();
</script></body></html>
